    <script>
        const searchIndex = [{"path": "about.html", "title": "about", "content": "tmp7dl9_k6c SLiMS is web-based Open Source Software (OSS) developed to meet the requirements of web-based library automation, from small to large scale. Because it is full-featured and still actively developed, SLiMS is suitable for libraries that have varied collections, several staff members and a networked environment, whether local network (intranet) or the Internet. Another SLiMS feature is that it is multi-platform, which means it can run natively in almost all Operating Systems that support the programming language PHP (http://www.php.net) and MySQL RDBMS (http://www.mysql.com). SLiMS itself is developed on the platform of GNU / Linux and is running well on other platforms such as Unix * BSD and Windows. SLiMS is made up of web-based applications with cross-platform considerations and completely developed using Open Source Software, i.e : PHP Web Scripting Language, (www.php.net) and MySQL Database Server (www.mysql.com). To increase interactivity in such a desktop application, it also uses AJAX technology (Asynchronous JavaScript And XML). SLiMS also uses Open Source Software to add features such as PhpThumb and SIMBIO ( a development platform developed from the project Igloo). SLiMS is licensed under the GPLv3 which guarantees the freedom to obtain, modify and redistribute (rights to use, study, copy, modify, and redistribute computer programs). More details about GPLv3 can be read at http://www.gnu.org/licenses/gpl-3.0.html. SLiMS version 1 and 2 were not released to the public because it was still being tested and was being refined. Since version 3, SLiMS has been considered stable enough to be released to the public and it is time-tested by the librarian community. Through peer-to-peer review by the public, SLIMS will become even more stable software and has more features that accommodating many needs. To view a demo and download SLIMS software, visit http://slims.web.id. General Features Online Public Access Catalog (OPAC) displays thumbnails on-the-fly. The thumbnail is useful for displaying the book cover. OPAC modes available include simple search (Simple Search) and advanced (Advanced Search) Details are also available in XML (Extensible Markup Language) record format, standard MODS for web service needs OAI - PMH features as standard data exchange Features Z39.50, SRU and p2p services to enable copy-cataloging from various libraries Efficient data management to minimize repetition of bibliographic data Management master files for referential data such as GMD (General Material Designation), Collection Type , Publisher, Author, Location, Suppliers, and others Circulation with the following features: Transactions of borrowing and returning Reserve collection Flexible lending rules Information on delays and fines Membership management including members’ pictures capture directly in the system Collection inventory (stocktaking) Reports and statistics Management of periodicals Supports the management of multimedia documents (.FLV, .MP3) and digital documents, particularly PDFs, in streaming form SLiMS supports a variety of languages including formats that do not Latin scripts Provides a variety of languages in the interface (Indonesian, English, Spanish, Arabic, German, Bengali, Thai, etc.) Support to establish the parent catalog and federated search application: UCS and Nayanes Library visitor counter Member area, to view and download the collection was and never borrowed Notification of delays and members orders System module with the following features: Configure global system Modules Management User Management (library staff) and Access level Groups Setting holiday periods Creation of automated barcodes Backup utilities and various other features that we can not cover in this introduction. Please continue reading the following chapters for full documentation.", "folder": "Root"}, {"path": "launch-SLIMSdocs.html", "title": "launch-SLIMSdocs", "content": "SLiMS Manual", "folder": "Root"}, {"path": "LICENSE.html", "title": "LICENSE", "content": "GNU GENERAL PUBLIC LICENSE Version 3, 29 June 2007 Copyright (C) 2007 Free Software Foundation, Inc. Everyone is permitted to copy and distribute verbatim copies of this license document, but changing it is not allowed. Preamble The GNU General Public License is a free, copyleft license for software and other kinds of works. The licenses for most software and other practical works are designed to take away your freedom to share and change the works. By contrast, the GNU General Public License is intended to guarantee your freedom to share and change all versions of a program--to make sure it remains free software for all its users. We, the Free Software Foundation, use the GNU General Public License for most of our software; it applies also to any other work released this way by its authors. You can apply it to your programs, too. When we speak of free software, we are referring to freedom, not price. Our General Public Licenses are designed to make sure that you have the freedom to distribute copies of free software (and charge for them if you wish), that you receive source code or can get it if you want it, that you can change the software or use pieces of it in new free programs, and that you know you can do these things. To protect your rights, we need to prevent others from denying you these rights or asking you to surrender the rights. Therefore, you have certain responsibilities if you distribute copies of the software, or if you modify it: responsibilities to respect the freedom of others. For example, if you distribute copies of such a program, whether gratis or for a fee, you must pass on to the recipients the same freedoms that you received. You must make sure that they, too, receive or can get the source code. And you must show them these terms so they know their rights. Developers that use the GNU GPL protect your rights with two steps: (1) zations. To \"modify\" a work means to copy from or adapt all or part of the work in a fashion requiring copyright permission, other than the making of an exact copy. The resulting work is called a \"modified version\" of the earlier work or a work \"based on\" the earlier work. A \"covered work\" means either the unmodified Program or a work based on the Program. To \"propagate\" a work means to do anything with it that, without permission, would make you directly or secondarily liable for infringement under applicable copyright law, except executing it on a computer or modifying a private copy. Propagation includes copying, distribution (with or without modification), making available to the public, and in some countries other activities as well. To \"convey\" a work means any kind of propagation that enables other parties to make or receive copies. Mere interaction with a user through a computer network, with no transfer of a copy, is not conveying. An interactive user interface displays \"Appropriate Legal Notices\" to the extent that it includes a convenient and prominently visible feature that (1) displays an appropri", "folder": "Root"}, {"path": "Installation/0. How-to.html", "title": "0. How-to", "content": "tmpbm4id0bt In this documentation, several installation methods will be discussed. The installation uses the SLiMS installer and the SLiMS Portable installation (PSLiMS). SLiMS is a multi-platform application. In other words, SLiMS can be installed on hardware with MS-Windows, GnU / Linux, and / or MacOS operating systems installed. This installation how-to is intended for SLiMS 9 Bulian release code 9.4.1. To install this version of SLiMS, you need to meet these minimum requirements: PHP version 7.4 MySQL version 5.7 and or MariaDB version 10.3 PHP GD provided/enabled PHP gettext provided/enabled PHP mbstring provided/enabled Source Code In order for SLiMS to be installed, ensure that the web server (web server, for example Apache web server), MySQL (database application), and PHP (programming language) is installed on the server hardware and running properly. It would be more helpful if the phpMyAdmin or Adminer application was also installed to assist in database setup via the web interface. If SLiMS is used on the internet (public), it is recommended to increase security by adding a firewall on the TCP / IP side (layer 3 and 4 of the OSI layer), on the application side (for example modsecurity) and on the database side (for example greensql). After the system to be used is ready, place the SLiMS source code in the web root directory that you are using. Source Code with GnU/Linux For users of the Gnu / Linux operating system, for example GnU / Linux Ubuntu (or Debian), the web root directory can be found in the /var/www/html directory. For users of GnU / Linux Ubuntu version 12.04 and below, the web root directory is in the /var/www/ directory. First download the SLiMS source code which can be obtained via the SLiMS page or through the repository on the GitHub page . Then place it in the web root directory. Extracting Source Code The next step is to extract the compressed source code. Enter the command: $ sudo unzip slims9_bulian-master.zip After the extraction process is complete, a single SLiMS installation directory will be created in the web root directory (usually the directory name will be the same as the compressed file name). Start Installation After the extraction process is complete, we can start the SLiMS installation process using the SLiMS Installer. Source Code with Microsoft Windows For users of this operating system, the use of Apache, PHP, MySQL is available in packages. Many packages that can be used. One of the best known is XAMPP by Apache Friends. This application can be downloaded at http://apachefriends.org. After installing XAMPP, you can start the web server and database services by selecting the XAMPP control panel from the application menu. img If you are using XAMPP, then the web root directory is located in xampp/htdocs. To start installing SLiMS using source code, copy the SLiMS source code files, as written in the previous chapter, into that directory. After you finish copying the files, the next step is to decompress the source files. To decompress, you can use a 7zip application (or something similar like WinZip and WinRAR). After the extraction process is complete, we can start the SLiMS installation process using the SLiMS Installer. The Installer Like previous versions of SLiMS Installer, in this version, you don’t need to define databases manually. You only need to enter the name of the database that will be used, the name of the user who has access rights (usually root or define it yourself), and don’t forget the password used to access the database. img Before going to the next step, let’s discuss the appearance of the new installer on SLiMS 9 Bulian. This new installer, functionally, is not much different from the previous installer, but is presented with a more “fresh” appearance. Some of the installer’s functionality is also made easier for novice users to understand. To start the SLiMS installation process, you can press the “Get Started” button. Then you will be taken to the System Requirements page. img This page will scan the system whether the computer you are using already has the required components. Components marked with the word optional are alternative components. In other words, if these components are not available / installed, the SLiMS installation can still be run. Another case with components that are not marked with optional words. The components that are not marked are components that MUST be installed. Without these components, the SLiMS installation cannot continue. If you use the XAMPP application as an AMP application (Apache, MySQL, PHP) installed on the system you are using, then these components are installed by default. In the “Pre-Installation Step” section, make sure the directories displayed in that section have changed their status to read-write. This case only occurs on Unix or GnU / Linux based operating systems. If you are using an MS-Windows operating system, you do not need to change directory permissions on these directories. ", "folder": "Installation"}, {"path": "Introduction/0. Disclaimer.html", "title": "0. Disclaimer", "content": "tmpx7pytoiv Disclaimer: This documentation comes without guarantee. You can copied and redistributed in any form. You are also free to use this documentation for commercial use. The documentation was licensed under Attribution-ShareAlike 4.0. International (CC BY SA 4.0). This English documentation was built based on the English version documentation, SLiMS 7 Cendana based, translated by Jim Richardson . And some additional chapter were translated using Google Translate.", "folder": "Introduction"}, {"path": "Introduction/1. Release Features.html", "title": "1. Release Features", "content": "tmp31z14w9s Using free open source software/free software is like quoting statements from other people’s work in the academic field. the original author didn’t ask for anything at all, not even money. They only ask that you mention their name and work in your reference; is it difficult? (Arie Nugroho, Core Programmer of SLiMS) Four years since SLiMS 8 Akasia has been released, SLiMS grew, not into perfection but, along with many inputs from its users, the software keep improving. Patches and fixes were made for the next release. Built with the zest to always move forward, keeping up with new technologies, SLiMS 9 Bulian emerge with the willingness to become more easy to use, helping librarian to manage their daily chores and while doing so, make resource/data sharing with libraries, easier. Features (Release tag 9.4.1) For the 9.4.1 release, SLiMS bring changes to: Fixed : Hidden ajax list Fixed : Hidden menu header for user not administrator Update : Sub-menus view for dark mode admin template Added : User other than (super) admin unable to change username Fixed : Error when user try to save profile change", "folder": "Introduction"}, {"path": "Introduction/2. Requirements.html", "title": "2. Requirements", "content": "tmpcgg03lqe Let us split requirements into several parts. Installed Software Requirements To run SLiMS 9 Bulian, you have to install these least requirements within your machine. Apache 2.4 Mysql 5.7+ or MariaDB 10.3+ PHP 8.1+ (PHP 8.3 recommended) phpMyAdmin and or Adminer for database management console (optional) Unless you are using XAMPP, use the XAMPP 7.4.x which you can download at https://www.apachefriends.org. Or if you choose to use the Portable SLiMS, you can download at https://slims.web.id/. Browser Requirements SLiMS 9 Bulian works best with these browsers. Mozilla Firefox (Use or update for latest version) Google Chrome or Chromium (Use or update for latest version) Opera (Use or update for latest version) Microsoft Edge (Use or update for latest version) Hardware Requirements As for the hardware, you need to have machines with these least specification. 4GB of RAM 500GB of HDD Minimum Intel Core 2 Duo processors or equivalent with 2 cores", "folder": "Introduction"}, {"path": "Introduction/3. Code Name.html", "title": "3. Code Name", "content": "tmp3ep33hkh As an appreciation to the indigenous floras of Indonesia, we begin to place a code name, since Senayan 3 Stable 14 release, to SLiMS releases, so our users can learn about the diversity of floras in Indonesia. As in this release, we named it after a Bulian tree. SLiMS 9 Bulian. Bulian is native to Brunei; Flores, Java, Kalimantan and Sumatra in Indonesia; the Sabah and Sarawak states of Malaysia; and the Sulu Archipelago of the Philippines. It is threatened by habitat loss. The government of Indonesia and the state government of Sarawak have formally banned the export of this species. Illegal smuggling continues to be a major problem. The species is threatened by over-exploitation, predominantly by illegal migrant loggers. Current demand for the timber is fueled for its esteem among Chinese as a coffin wood (as it is resistant to insect and rot). Included in list of vanishing timber species of the Philippines and considered almost extinct in Sabah. In Java and Sumatra it exists solely in National Parks. Currently the situation is assessed as a serious depletion of stands. The species is only planted on a small scale because the supply of seeds and seedlings is inadequate. The IPB Bogor Agricultural Institute (Institut Pertanian Bogor) is currently breeding a generation of plants more hardy than the wild harvested seeds. Many Dayak believe that the ulin wood acts as a protective talisman to avoid attack from tigers and elephants. The Dayak believe that this use of the ulin talisman and the stands of ulin trees was and is the sole cause of a lack of Sumatran elephants or Sumatran tigers in Kalimantan and Sarawak. The potent ‘elephant and tiger repellent’ is alleged to be the sap of the tree, which has a strong, pleasant lemon-like odour.", "folder": "Introduction"}, {"path": "Introduction/4. Contributors.html", "title": "4. Contributors", "content": "tmpjkexoyac Senayan Developer Community We are: Hendro Wicaksono ( hendrowicaksono@gmail.com ) Arie Nugraha ( dicarve@gmail.com ) Wardiyono ( wynerst@gmail.com ) Purwoko ( tamanjiwa@gmail.com ) Arif Syamsudin ( aarif.syamsudin@gmail.com ) Rasyid Ridho ( rasyidridho@gmail.com ) Eddy Subratha ( mucill@gmail.com ) Indra Sutriadi ( indra.sutriadi@gmail.com ) Waris Agung Widodo ( ido.alit@gmail.com ) Heru Subekti ( heroe.soebekti@gmail.com ) Our fallen comrades: Sulfan Zayd ( sulfan@gmail.com , sulfan.zayd@gmail.com ) Widianto Nugroho ( wnugroho@gmail.com ) Language Contributors Most of the contributors are native speaker. They are: Germany: Tobias Zeumer ( tzeumer@verweisungsform.de ) Thai: Prasitichai เรารักในหลวง ( eak.pras@facebook.com ) Bengali: A. K. M. Nurul Alam ( nalamapu@gmail.com ) Persian: Mohammad Javad Mansourzadeh ( info@mansourzadeh.ir ) Arabic: Rasyid Ridho ( rasyidridho@gmail.com ), Bounama Kouider (for full Arabic support) Brazilian Portuguese: Eduardo Koiti Kataoka ( edukataoka@yahoo.com.br ) Spain: Jhon Urrego Felipe Mejia ( ingenierofelipeurrego@gmail.com ) Urdu (Pakistan): Faheem Akbar ( onlinevws@gmail.com ), Aijaz Akhter Ahmadani ( ritelibrarian@gmail.com ) Turkish: Ali Yasir Yılmaz ( aliyasiryilmaz@gmail.com ) Malay: Jerry Mohd. Arif Russian: Russian: Igor Gaydyshev (https://sourceforge.net/projects/russiantranslationforsenayan/) Code Contributors: Drajat Hasan ( drajathasan20@gmail.com ) John Antony ( john.antony@iamplus.com ) Gettext support: Tobias Zeumer Membercard modification: Jushadi Arman Saz (jushadi@unsulbar.ac.id) English documentation: Jim Richardson", "folder": "Introduction"}, {"path": "Modules/10_SerialControl/00_index.html", "title": "00_index", "content": "tmpv6_7mp79 Serial Control The Serial Control Module will run if bibliographic data is subscribed for periodical titles. If there is no bibliographic data in a table that indicates the frequency, this functionality will not work and the screen will look like below: serial_control1 The information that distinguishes between magazine bibliographic data and other document types is the frequency/time the serial is published. When there is frequency data the screen will show the details of the serial titles, similar to below serial_control2 An option then exists to Add new subscription , and to enter subscription information. serial_control3 That information is: Subscription Start : fill in the date the subscription will start to be received at the library. Total Exemplar Expected : enter the total number you expect to receive in a period of a subscription. E.g to subscribe for a year on a monthly basis insert 12. Period Name : Name the subscription period to provide differentiation between periods. Also give a name to distinguish copy subscription one, a second subscription, and so on. Subscription Notes : Insert important or useful notes on the subscription. GMD : if necessary, replace it with the appropriate GMD of the item to be subscribed", "folder": "Modules/10_SerialControl"}, {"path": "Modules/3. Bibliography/0. Bibliographic List.html", "title": "0. Bibliographic List", "content": "tmpgt6kl4zu This sub-menu is used to view bibliographic data that already exists in the SLiMS database. img With the 9.3.1 release, this sub-menu has taken a new twist, with the appearance of the book cover. This will make it easier for librarians or library managers to identify collections to be inputted. At least visually it will be seen whether a title has been inputted or not, when a search has been performed. img The information displayed in this sub-menu are: Delete (in form of checkbox) Edit (by clicking the pencil icon) Title ISBN/ISSN Copies Last Update This sub-menu allows you to sort the list by title, ISSN / ISBN, number of copies, and the last date the data was updated. With this sub-menu, bibliographic data can be searched for editing or deletion. Here are the steps for editing or deleting bibliographic data. Find the bibliographic data that will be converted / entered by typing the title in the “Search Bibliography” field, clicking “Search” Once found, put a check mark on the data box to be deleted then click “Delete Selected Data” or if you want to edit the bibliographic data, click the “Edit” icon (left of the title) to start editing data or click 2 (double) times on field for the title of the bibliography you wish to edit A display of bibliographic data that is still not active appears (will appear gray) Activate edit mode by clicking the “Edit” button in the lower right corner or the upper right corner Change the part that needs editing, then click “Save Change” In this sub-menu, there is a new feature (added in 9.2.1), namely “Advanced Filter” which allows us to filter bibliographic data by categories: Hide in OPAC Promote to Homepage img As indicated by pointer no. 1, click on the button to bring up the filters as shown in the image above. Then, in the following image, it is shown how to search using these filters. img To show ONLY collections with hidden status, select the option “Hide” To show ONLY collections with non-hidden status, select the option “Show” Select the “All” option to show all collections whether hidden or not Filters as shown in the picture above, are filters for collections whose status is hidden or not. img To display ONLY collections with status not being promoted, select the option “Don’t Promote” To display ONLY collections with status being promoted, select the option “Promote” Select the option “All” to display all collections whether the status is not promoted or vice versa Meanwhile, the filters shown in the image above are filters for collections whose status is being promoted or not. Don’t forget, after selecting the desired filter combination, to get the search results out, click on the “Search” button.", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/1. Add New Bibliography.html", "title": "1. Add New Bibliography", "content": "tmptwy1vd8v This sub-menu is used to add a new bibliography. The metadata that we must enter are: img Title. Collection title. Enter the title of the library material to be processed Author. Authorship. Enter the author’s name here Statement of Responsibility. Statement of responsibility. In this field, enter the author’s name without reversing it Edition. Edition statement. No need to be filled in if it is not included in the processed library material Specific Detail Info. Contains bibliographic-specific information, for example: the scale on the map. Not used in book processing Item (s) Code Batch Generator. In this field, we are required to select the template code pattern first. If you don’t have an exemplary pattern, click on the “Add New Pattern” button to add an exemplary pattern. img Adjust to the pattern you use. For example, if you use code B00001, then the pattern that must be created is: Prefix: B Suffix: make it empty Length serial number: 5 Once filled in, click on the “Save” button to save the created pattern. Close the pop-up, then select the “- Choose pattern -” field to select the pattern for the code that has been created. Then proceed by entering the number of processed copies in the “Total Item (s)” section. To fill in the listing details regarding the copy, click on the “Options” button. You will be faced with the details of the copy as when you enter the copy data in the standard way (a la SLiMS). However at this stage the Call Number field will not appear, as that data hasn’t been entered yet in the main bibliographic record. General Material Designation (GMD). This section contains processed data from library materials. By default, book collections use GMD = text; Note Added Field Resource Description Access (RDA) in SLiMS 8 Akasia: Content Type Media Type Carrier Type If your library has not used RDA as a detail for filling out library materials, these sections can be skipped. Frequency. The frequency of periodicals, this entry retrieves data from the Master File. If this field is filled, the bibliographic data will be detected as a serial publication and will appear in the Serial Control module ISBN / ISSN. ISBN or ISSN number Publisher. Publisher Name, taken from existing data in the Master File. If not, you can directly adding it by typing the name of the publisher and select the add new option. Publish Year. Publication Year Publication Place. Place of publication. Taken from existing data in the Master File. If not, you can directly adding it by typing the name of the publisher and select the add new option Collation. Collation / Physical Description. Contains information about the physical data of the book such as page number, thickness, whether there are attachments or not, and so on Series Title. Series title (if applicable). It is a large title in which there are small titles, such as The Story of the Prophets, with book titles under such as, The Story of the Prophet Adam, The Story of the Prophet Moses Classification. Classification number by subject (DDC, UDC or other). Begin typing and a drop-down selector will offer Classification numbers previously used. If the number you want is in the list, select it. If not in the list, keep typing your number until appears alongside your entry, and select that. Call Number. Item Call Numbers. Attached to the spine, is representative of the subject when placed on a shelf and determines shelving order. When you have already entered a Classification number, it will prefill the Call Number field, which can then be edited to add a prefix and/or suffix. If you have previously used the Item Code Batch Generator, when you complete this Call Number Field this will be allocated to all items, although individual items can then be edited to account for possible locations etc. If you have not created any items, and return to create them, the Call Number field will now be pre-filled. Subjects. Topic / subject. This data can also be retrieved from the Master File by first filling in the subject to be entered. By entering the subject first, one of the advantages is that a classification number can be assigned to each subject, for a preliminary classification. Language. Choice of language that the processed library materials are written in. Abstract / Notes. Snippets / summaries of processed library materials Image. Image (usually cover) that shows the identity of the collection. At SLiMS 9 Bulian, inserting a book cover image is easier. Provided, the computer you are using as the SLiMS server has internet access. img In this section, apart from inserting images conventionally (search via google - download - browse via file browser - upload), an automatic download of book cover images has been added, you can use search results via Google or by clicking on the “Trying search in DuckduckGo” button. When you click on the “Trying this search DuckduckGo” button, SLiMS will automatically find the cover image data based on the title that has been entere", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/10. Item Export.html", "title": "10. Item Export", "content": "tmp_vsstk29 img The output of the export item from SLiMS is as follows: *\"B00001\",\"\",\"Reference\",\"INV/B00001\",\"0000-00-00\",\"\",\"\",\"MyLibrary\",\"0000-00- 00\",\"\",\"\",\"1\",\"\",\"500000\",\"Rupiah\",\"0000-00-00\",\"2008-12-26 22:11:10\",\"2008-12-26 22:14:13\",\"Ajax : creating Web pages with asynchronous JavaScript and XML\"* The output is a reference if you want to enter data exemplars .csv to SLiMS. To clearly see the column patterns used in data copies in SLiMS, open the .csv file using a spreadsheet application such as MS-Excel or LibreOffice Spreadsheet. Just like the previous sub-chapters, in this sub-menu when exporting data copies there is also a “Put columns names in the first row” field. When this option is checked (Yes), the name of each column will be displayed in the first row of the exported file, as listed in the database.", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/11. Item Import.html", "title": "11. Item Import", "content": "tmptjw9qmil img This sub-menu is used to enter data copies into the SLiMS database. If this activity is carried out from one SLiMS database to another, the Item Import is carried out after the Data Import. This means that the copies will adjust the bibliographic data that has been imported first. Just like the previous sub-chapters, when importing data copies in this sub-menu, there is also a field “The first row is the columns name”. This section is related to the previous sub-chapters. If in the first row of the exported file there are column names, as listed in the database, then when importing, check the (Yes) option.", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/2. Item List.html", "title": "2. Item List", "content": "tmpg9g2f1wi This sub-menu is used to view number of copies in the SLiMS database. img The informations contained within the grid for this sub-menu are: Delete Edit Item Code Title Collection Type Location Call Number Last Updated With this sub-menu, you can also edit and delete copies. Here are the steps for editing or deleting copy data: Find the item(s) that will be edited / deleted by typing the title or the item code of the copy in the “Search” field then clicking on the “Search” button Once found, put a check mark on the data to be deleted then click “Delete Selected Data” or click the edit icon (left of the title) to start editing For editing mode, a display of data copies that is not active will appear (will appear in gray background color) Activate edit mode by clicking the “Edit” button in the lower right corner or the upper right corner Edit the necessary sections, then click “Save Change”", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/3. Checkout Items.html", "title": "3. Checkout Items", "content": "tmp8p4v2h9b img This sub-menu provides information about the copies whose status is being borrowed. This sub-menu is also equipped with a search facility using the item number and bibliographic title approach. The information contained in this sub-menu is: Item Code Member ID Title Loan Date Due Date", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/4. Labels Printing.html", "title": "4. Labels Printing", "content": "tmpg6h3nh4u With this sub-menu we can print collection labels based on the bibliographic data that has been entered into SLiMS. The following is the sequence of printing labels using the Labels Printing sub-menu. Click Labels Printing, the display will appear as follows: img Select the bibliography on which to print the label. Tip: use Shift key + click checkbox to quickly select more than one record in a sequence Note: A maximum of 50 data is printed once. In the Labels Print menu, it is possible to print more than one label, depending on the number of copies of the collection. Click the “Add to Print Queue” button to enter the selection into the print queue After adding the data to be printed, the amount of data to be printed appears. Value “0” will change, according to the amount of data to be printed img Click “Print Labels for Selected Data” to start printing Labels can also be resized by clicking on the “Change Print Label Settings” button img", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/5. Barcode Printing.html", "title": "5. Barcode Printing", "content": "tmpb078_nmr This sub-menu is a means of printing barcodes based on the copy number data that has been entered into SLiMS. The following is the sequence for printing a barcode using the Item Barcodes Printing sub-menu. Click the Item Barcodes Printing sub-menu, the display will appear as follows: img Select the number of copies to be printed. Tip: use Shift key + click checkbox to quickly select more than one record in a sequence Note: A maximum of 50 data is printed once. In the Labels Print menu, it is possible to print more than one label, depending on the number of copies of the collection. Click the “Add to Print Queue” button to enter the selection into the print queue After adding the data to be printed, the amount of data to be printed appears. Value “0” will change, according to the amount of data to be printed img Click “Print Barcodes for Selected Data” to start printing Labels can also be resized by clicking on the “Change Print Barcode Settings” button img", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/6. MARC Export and Import.html", "title": "6. MARC Export and Import", "content": "tmpfe3v6zzr This feature is use to export bibliographic data from SLiMS into .mrc format or import MARC data with either .mrc or .xml extension. Before using this feature, the requirement is that the SLiMS server has PEAR, FILE_MARC and Structures_LinkedList installed. On servers running the GnU / linux operating system (Ubuntu, for example), see how to install it on this blog: https://goo.gl/2bI4tX https://goo.gl/dejszi If it is installed, what will appear is: img img If you have a MARC file, for example .mrc (if you don’t have one, you can download a sample Marc file with a .mrc extension at http://opac.perpusnas.go.id) You can process it by clicking on the “Browse” button. and select the files you want to import. “Number of Record to Import” means how many listings / data will be imported, “0” (zero) means all listings in the file.", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/7. Catalog Printing.html", "title": "7. Catalog Printing", "content": "tmpn5ag7zw9 This feature can be used to print catalog cards. How to print is almost the same as how to print barcodes and book labels. The result of printing is as shown below: img As of SLiMS 9 Bulian release code 9.3.0, this sub-menu is having an option to make modification on what should be printed. Click on the right upper button called “Change Print Catalog Settings” img and you’ll see this picture below: img Self List Card. If you don’t want to print main catalog, choose “Hide” instead Title Card. If you don’t want to print the catalog card for title, choose “Hide” instead Author Card. If you don’t want to print catalog card for author, choose “Hide” instead Subject Card. And if you don’t want to print catalog card for subject, choose “Hide” instead Base on the settings you choose, you will then have the card needed to print.", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/8. Data Export.html", "title": "8. Data Export", "content": "tmp939v4ctw img This sub-menu is used to retrieve bibliographic data in the SLiMS application, which can then be included in other SLiMS applications. This process can be understood as data exchange. The export process will generate a .csv file. The .csv format when we look at the contents, sequentially contains the following data: Title GMD Edition ISBN/ISSN Publisher Publishing Year Collation Series Title Call Number Language Publishing Place Classification Abstract/Notes Cover File Name Attachment File Name Author Subjects Item Code For example the output of a .csv file, when opened using a text editor: *\"Corruption and development\",\"Text\",\"\",\"9780714649023\",\"Taylor & Francis Inc.\",\"1998\",\"166 p. : ill. ; 22 cm.\",\"\",\"364.1 Rob c\",\"English\",\"London\",\"364.1/322/091724 21\",\"The articles assembled in this volume offer a fresh approach to analysing the problem of corruption in developing countries and the k means to tackle the phenomenon.\",\"corruption_development.jpg\",\"\",\" <Robinson,Mark>\",\"<Corruption><Development>\",\"<B00006>\"* In the export process there are options: Field Separator. Defines the delimiter between fields Field Enclosed with. Defines an opening / closing character Record Separator. Separators between data Number of Records to Export (0 for all records). Amount of exported data Start From Record. The first data to be exported starts from Put columns names in the first row. When this option is checked (Yes), the name of each column will be displayed in the first row of the exported file, as listed in the database To clearly see the column patterns used in bibliographic data in SLiMS, open the .csv file using a spreadsheet application such as MS-Excel or LibreOffice Spreadsheet. Note: As of the 9.2.0 release, this sub-menu includes the feature of bringing up header fields in the export results, so that it will display the fields mentioned above.", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/9. Data Import.html", "title": "9. Data Import", "content": "tmp2jtpa8bc img This sub-menu is used to retrieve bibliographic data from outside SLiMS in csv format (or from the SLiMS database in .csv format). For data import instructions, the SLiMS Development team has made in detail several conversion manuals for the following applications: Athenaeum CDS/WIN/SIPISIS The manuals can be downloaded at: Manual migrasi data dari Athenaeum - https://goo.gl/pPUY9B Manual migrasi dari CDS/WIN/SIPISIS - https://goo.gl/D8VLFP For conversion from Athenaeum, the SLiMS Development team once created an online migration tool which can be accessed on the following page: Senayan Database Converter 0.1 - https://goo.gl/jD5crE Note: The application has been stopped in development for a long time. There could be some things that are irrelevant. In the import process, there are several options: File To Import. The file to be imported has the extension .csv and is in accordance with the .csv format used by SLiMS Field Separator. Separators between segments used. No need to change Field Enclosed with. The opening / closing character of a segment. It doesn’t need to be changed Number of Record to Import (0 for all records). Amount of data to import Start from record. The first data to import, starts at The first row is the columns name. This section is related to the previous sub-chapters. If in the first row of the exported file there is a column name, as listed in the database, then when importing, check the (Yes) option As of the 9.2.0 release, this sub-menu includes a feature to ignore the header field in the export result (if any), so that it will display the fields mentioned above.", "folder": "Modules/3. Bibliography"}, {"path": "Modules/3. Bibliography/Copy Cataloging/1. MARC SRU.html", "title": "1. MARC SRU", "content": "tmpxh_faagp img A copy cataloging feature that retrieves data from applications that use MARC (Machine Readable Catalog) metadata. By default, this service is linked to the database of the National Library of Indonesia. img Collection searches can be approached through: ISBN/ISSN Title/Series Title Authors All fields After getting the desired search results, tick on the bibliographic data collection to be copied. Then click on the “Save Marc Records to Database” button to start copying. img", "folder": "Modules/3. Bibliography/Copy Cataloging"}, {"path": "Modules/3. Bibliography/Copy Cataloging/2. Z3950 SRU.html", "title": "2. Z3950 SRU", "content": "tmpxg_qfmmc img It is a copy cataloging feature that utilizes the Z3950 protocol as a data exchange protocol. By default, this service is linked to the database of the Library of Congress, United States of America. img Collection searches can be approached through: ISBN/ISSN Title/Series Title Authors All fields After getting the desired search results, tick on the bibliographic data collection to be copied. Then click on the “Save Z3950 Records to Database” button to start copying. img", "folder": "Modules/3. Bibliography/Copy Cataloging"}, {"path": "Modules/3. Bibliography/Copy Cataloging/3. P2P Service.html", "title": "3. P2P Service", "content": "tmp95nxtfn7 img P2P Service is a catalog copy feature created from Senayan 3 Stable 14. The basic concept of this feature is to exchange bibliographic data between SLiMS users. P2P Service makes use of SLiMS’s xml facility to share bibliographic collections. To use it, simply click P2P Service, enter a keyword and select the location / url / library that you are looking for. If SLiMS finds the collection it is looking for, it will be displayed. Update: On the release of SLiMS 9 Bulian with the latest release tag, the MARC SRU service and the Z3950 SRU service can also download cover images, provided the cover image data is available in the captured dataset. In SLiMS 9 Bulian, copy cataloging using P2P Service is equipped with the ability to download book cover data and attachments (if such data is available). img img The picture above shows the bibliographic data to be copied, has book cover data and digital files. Bibliographic data can be copied without having to copy the available digital files. However, existing digital data cannot be copied without copying the bibliographic data. img The “Details” button that appears on the image, will display the data entry, as an indication of whether the data to be copied provides good and complete information or not. As shown in the following image. img img When the “Original Uri” button is clicked, you will be taken to the original page, where the data is located. img", "folder": "Modules/3. Bibliography/Copy Cataloging"}, {"path": "Modules/3. Bibliography/Copy Cataloging/4. Configuration.html", "title": "4. Configuration", "content": "tmpe10d67pq To add a server whose meta data will be used when copy cataloging, you can add it via the Cataloging Servers sub-menu in the Master File module. img To start adding, click on the “Add New Server” button which will bring up a form like the following: img Server Name. Enter the name of the server you want to appear in the list URI. Is the location of the application page that provides metadata that will be retrieved. Example: http://ciseeng.web.id/slims. The link is the location of the server that provides data for P2P services Note: Currently supported protocols for data copying are http and https protocols. Server Type. Fill in the type of copy cataloging service that your server uses as a reference. Is it the MARC SRU, Z3950, or P2P. When finished, click on the “Save” button to save the configuration that you have made. The list of servers that you have created will appear when you copy cataloging the Bibliography module.", "folder": "Modules/3. Bibliography/Copy Cataloging"}, {"path": "Modules/4_Membership/00_view member list.html", "title": "00_view member list", "content": "tmp71broot6 img Used to view the list of members who have registered into the system. The information displayed is: Delete Edit Member ID Member Name Membership Type Email Last Updated If there is a member whose membership period has expired, we can renew it by clicking on the edit menu represented by a pen icon (in the “Edit” field) or double-clicking on the member’s data. Membership extension can be done by ticking the checkbox “Extend”. img Alternatively, it can also be done by clicking on the “View Expired Member” button, ticking the checkbox for the member data to be extended, then clicking “Extend Selected Member (s)”. img", "folder": "Modules/4_Membership"}, {"path": "Modules/4_Membership/01_add new member.html", "title": "01_add new member", "content": "tmpppgp_z58 img Facility to add new member data to the SLiMS system. The member data entered are: Member ID. Use the ID that already use before. Whether you are using citizen identification number or other form of numbering for your member. Member Name. Member’s Full Name Birth Date. Date of birth, to be filled in according to the data on the identity card Member Since. Registered date. The time in this field will change automagically if the respective membership is extended Register Date. First registered date Expiry Date. Expiration date. By default, the Auto Set option is checked. This means that the membership period will be calculated according to the selected membership type. However, if the check mark is removed, the expiration date is determined manually Institution. Name of institution, name of office or name of organization Membership Type. Membership type which will be defined later in the Member Type sub-menu Sex. Adjust the content based on information given by your user Address. Home or office address Postal Code Mail Address. Content of this field can be similar as the Address field. This section is intended if the mailing address is different from the home address Phone Number Fax Number Personal ID Number: Identity number listed on KTP, SIM, KITAS, Passport, etc. Notes. Field notes that can be filled in to provide a brief description of the user. The contents of this section should only be seen by the librarian Pending Membership. If this section is checked, then the member concerned will not be able to circulate, even though it is still active. This can be applied as a sanction against members who violate library regulations Photo. Upload member photo files or you can take picture with the in-app photo style provided using your webcam Email New Password and Confirm New Password. Enter the password to access the Member Area page on the OPAC", "folder": "Modules/4_Membership"}, {"path": "Modules/4_Membership/02_member type.html", "title": "02_member type", "content": "tmp0yggmgyd img This menu is the rules used by SLiMS, for loan transactions, in addition to additional rules in the Loan Rules sub-menu. Click on the “Add New Member Type” button to add a membership type. Within this membership type are defined: img Member Type Name. The name of the membership type applied by the library Loan Limit. Number of copies that can be borrowed Loan Period (In Days). The length of time to borrow Reserve. Book order feature that is currently on loan. There is an “Enable” option to enable this feature. Select “Disable” to turn off this feature Reserve Limit. Number of copies that can be reserve Membership Period (In Days). The time specified for the membership period is adjusted to the applicable provisions in the library Reborrow Limit. Number of copies that can be borrowed back Fine Each Day. How much money counted as fines per day Overdue Grace Period. Delay tolerance period (in days)", "folder": "Modules/4_Membership"}, {"path": "Modules/4_Membership/03_membercard print.html", "title": "03_membercard print", "content": "tmpw0ox1hwy img This menu is used to print membership cards. How to print it is the same as how to print a label or barcode. The information contained in this membership card includes: Member ID Member Name Personal ID Number Address/Phone Number Member Barcode Photo (if exist) The identity library on the other side of the card, which contains: Library rules Library website Library email Etc. In SLiMS 9 Bulian, a new card format is provided, namely “Classic”. So, there are 2 (two) card formats that can be used by users. img View of Classic card type img View of Old card type To change the appearance of a member card that will be printed, please click on the “Member Card Print Settings” button then select the desired card theme. img To select the desired membership card theme, click on the “Activate” button. Then to change the settings for each type of card, click on the “Customize” button.", "folder": "Modules/4_Membership"}, {"path": "Modules/4_Membership/04_member export.html", "title": "04_member export", "content": "tmpis3fik44 This menu is used to retrieve member data in the SLiMS database and the result is data in .csv format. To clearly see the column patterns used in member data in SLiMS, open the .csv file using a spreadsheet application such as MS-Excel or LibreOffice Spreadsheet. img Just like the previous sub-chapters, in this sub-menu when exporting data copies there is also a “Put columns names in the first row” field. When this option is checked (Yes), the name of each column will be displayed in the first row of the exported file, as listed in the database.", "folder": "Modules/4_Membership"}, {"path": "Modules/4_Membership/05_member import.html", "title": "05_member import", "content": "tmpuu6d2gr0 This menu is used to retrieve member data from outside the SLiMS application. The imported data format is .csv. The data columns to be imported must match, as exemplified by the export results discussed in the previous sub-chapter. img Just like the previous sub-chapters, when importing data copies in this sub-menu, there is also a field “The first row is the columns name”. This section is related to the previous sub-chapters. If in the first row of the exported file there are column names, as listed in the database, then when importing, check the (Yes) option.", "folder": "Modules/4_Membership"}, {"path": "Modules/5_Circulation/00_starttransaction.html", "title": "00_starttransaction", "content": "tmpuxhxwhd_ Transactions through this sub-menu begin by entering the name or ID of the member concerned. After entering the member lending menu, the information that appears is: Member Name Member Email Register Date Member ID Member Type Expiry Date Photo of member Below that are tabs: Loans. To record borrowing transactions Current Loans. Current loan list Reserve. For the needs of ordering copies whose status is being borrowed Fines (fines). Gather information about borrowing fines (if any). Debits and penalties are recorded in this tab Loan History. Loan history made by the member img In the Current Loans tab, there are facilities to return and extend the loan. Note: After completing the process of borrowing (Loans) and ordering (Reserve) do not forget to click on the “Finish Transaction” button. Without pressing this button, all transaction processes will not be recorded in the system and loan transactions cannot be carried out for the next user. Since the Senayan3-stable13 version, a transaction note printing feature is available. To activate this feature, the first step that must be done is to activate the Print Circulation Receipt section in the System Configuration sub-menu. See the System module documentation. The proof of circulation print option will appear after clicking on the “Finish Transaction” button. Starting from the Senayan3-stable11 version, it is possible to manually determine the date of loan and return. That is, the date of borrow and return can be determined not based on the configuration of the rules that have been determined through the Member Type or Loan Rules. For activation, please look at the System Configurations sub-menu in the System menu. Determining the Loan and Due date manually can be done by clicking the date we want to change.", "folder": "Modules/5_Circulation"}, {"path": "Modules/5_Circulation/01_quickreturn.html", "title": "01_quickreturn", "content": "tmpcfbz346s To make a quick return, without having to enter the user account, directly enter the ID of the copy (barcode) of the collection to be returned. img After the barcode/item number was entered, the transaction is automatically recorded in the user data who make the return, through this sub-menu. img", "folder": "Modules/5_Circulation"}, {"path": "Modules/5_Circulation/02_loanrules.html", "title": "02_loanrules", "content": "tmpa22u2s0v It is a facility to define specific loan rules based on Member Type, Collection Type, GMD. The rules defined in this facility are the same as when we created a rule in the Member Type sub-menu by filling in the fields: Loan Limit Loan Period Reborrow Limit Fines Each Day Overdue Grace Period img An example of defining Loan Rules: Your library has 3 collection types: Book, Audio Visual, Thesis One of the membership type in your library is: Students. With a total borrowing allowance of 2 collections, namely: 1 for the Thesis collection type and 1 for the Audio Visual collection type For that, of course you must have a membership type “Student” with a total borrowing of 2 collections Then in Loan Rules, which must be defined: Membership type “Student”, loan limit for collection type “Audio Visual” is 1 Membership type “Student”, loan limit for collection type “Thesis” is 1 When you are finished defining Loan Rules, click on the “Save” button to save the defined rules. PLEASE REMEMBER that this is the additional rules of loan with a spesific purposes. If the loan rules defined in the Membership Type is enough for your institution, you should not add another set of loan rules within this sub-menu.", "folder": "Modules/5_Circulation"}, {"path": "Modules/5_Circulation/03_loanhistory.html", "title": "03_loanhistory", "content": "tmpp7nue10f Contains data on transactions that have been carried out. The data that appears consists of: Member ID Member Name Membership Type Item Code Title Loan date Due date Loan Status img This sub-menu provides the facility to print the loan history list by clicking on the “Print Current Page” button and export the loan history list into spreadsheet format by clicking on the “Export to spreadsheet format” button. In addition, it is also possible to search historical borrowing data. The search for a list of loan history is carried out based on: Member ID/Member Name Membership Type Title Item Code Loan Date From Loan Date Until Loan Status Location Record each page img This facility can be displayed by clicking on the “Show More Filter Options” button.", "folder": "Modules/5_Circulation"}, {"path": "Modules/5_Circulation/04_overduelist.html", "title": "04_overduelist", "content": "tmp_xazkuwd It is a facility to find out members with late status. The information displayed in this facility is: img Member ID Member Name Other member data such as Address, Email, and No. Telephone Item number Title (and book price) Time overdue Loan Date Due Date With this sub-menu we can also print and search for overdued data. Overdued data search is carried out by category: img img Member ID/Member Name Loan Date From Loan Date Until Record each page", "folder": "Modules/5_Circulation"}, {"path": "Modules/5_Circulation/05_reservation.html", "title": "05_reservation", "content": "tmpgzkfmkiz This sub-menu is used to view the list of collections that are being reserved by members. Previously, this sub-menu only recording reservation coming from the reservation tab within user circulation process. And the previous meaning of “reservation” is to explain a reservation made for items that having the status of being loan or on loan. Since SLiMS 9 Bulian release code 9.4.0, this sub-menu is also receiving data from reservation made by user from the OPAC’s Member Area. img img The information contained in this menu is: Item Code Title Member Name Member ID Reserve Date You can also create filter to search the data you need regarding reservation that still included in this sub-menu. img Once the item is circulated from the Start Transaction sub-menu, the considered item number will disappear from the reservation list.", "folder": "Modules/5_Circulation"}, {"path": "Modules/6_Stocktake/00_stocktakehistory.html", "title": "00_stocktakehistory", "content": "tmpg073dp7c The Stock Take Module is a facility available in SLiMS to assist librarians in carrying out collection inventory activities. This activity aims to re-adjust all collections in the library so that you can find out how many items are available, the number of items that are missing, the number of items that are damaged, and the items that are currently borrowed by library patrons. When the inventory process starts, all items except those that are being borrowed (with the status “On Loan”) will be considered lost. Then enter the “Current Lost Item” sub-menu until the collection is entered in the exemplary data in the inventory process. img In this module, when the stock take process has not been activated, you will only find these 2 (two) menus: Stock Take History Initialize The Stocktake History will list previous stocktakes by name [ the name for each stocktake being set when you initiate a stocktake], together with the Start and End Dates and the Report. When you choose to initialise a stocktake, you’ll be prompted to make a backup if you have not done so. You should always backup before a stocktake. You must provide a name for the stocktake, and you can then apply filters for GMD, Collection type, Location, Shelf location, and Classification , if you want to stocktake only part of your library. The default for these is ALL , which will produce a full stocktake. Once initialised, the Initialise submenu will be replaced with submenu items: Current stocktake : Allows entry of Item code . Clicking the Change status button will mark the item as not lost. Stocktake report : Provides a comprehensive report on the stocktake including collection totals, losses, loans and personnel involved. Clicking the Download report button will produce a pop-up allowing printing , print to pdf etc. Current lost item : Displays items that are currently marked as lost Stocktake log : Provides a log of all Stocktake name consisting of time, user, and messages Upload List : Allows upload of a plain text file (.txt) containing a list of item codes to stocktake; each item code on a separate line. Resynchronise : Refreshes item data in the database. Resynchronise will only update the current stocktake’s item data. It won’t update any new title or item data that was inserted in the middle of the stocktake process Finalise Stocktake . Does what it says. Once ended, the stocktake can’t be rolled back. An option to purge lost items from the collection is also presented. Backup the data base before committing to this.", "folder": "Modules/6_Stocktake"}, {"path": "Modules/6_Stocktake/initialize/00_current.html", "title": "00_current", "content": "tmp18p3ysmn Stock take activity is carried out in this sub-menu, namely by starting to enter the item number from each copy. img There is a field “List stocktakes by:” which can be selected “Current User Only”, meaning that the list of copies that are visible is the one inventoried by the librarian concerned or “All User”, meaning that the list of copies inventoried is the copy that is entered in data by all librarians who carry out inventory.", "folder": "Modules/6_Stocktake/initialize"}, {"path": "Modules/6_Stocktake/initialize/01_report.html", "title": "01_report", "content": "tmpb5vpbmds This sub-menu will display the progress of the current stock take activity. img", "folder": "Modules/6_Stocktake/initialize"}, {"path": "Modules/6_Stocktake/initialize/02_lostitems.html", "title": "02_lostitems", "content": "tmp_9vt2344 Will display a list of unprocessed copies to be recorded in stock take. img", "folder": "Modules/6_Stocktake/initialize"}, {"path": "Modules/6_Stocktake/initialize/03_logs.html", "title": "03_logs", "content": "tmpqtzeq2_6 Displays a list of messages encountered while the stock take process is running. img", "folder": "Modules/6_Stocktake/initialize"}, {"path": "Modules/6_Stocktake/initialize/04_resync.html", "title": "04_resync", "content": "tmprpzv7iu4 This sub-menu is used when we want to update (repair) copy data (and / or bibliographic data) when the stock take process is active. For the record, it is possible to correct copies of data (and / or bibliographies), because it is necessary to correct data from related copies. For example, the title on the copy was mistyped or incomplete. Once repaired, click on the “Resynchronize now” button. img", "folder": "Modules/6_Stocktake/initialize"}, {"path": "Modules/6_Stocktake/initialize/05_listupload.html", "title": "05_listupload", "content": "tmp5mutvnan This sub-menu is used to upload data for items number that will be recorded in the stock take using text format (file type .txt). The file display is as shown. img Click on the “Browse” button to insert a previously created text file. Then click on the “Upload File” button to start uploading the text file. img If the text file upload process goes well, the page will inform you that “Successfully upload stock take xxx.txt, xxx item codes scanned”, as described in the image above.", "folder": "Modules/6_Stocktake/initialize"}, {"path": "Modules/6_Stocktake/initialize/06_finish.html", "title": "06_finish", "content": "tmpstw1chkz Click this sub-menu when we have finished taking inventory. In this sub-menu there is a “Purge Lost Item” option. If we check “Yes”, then the duplicate data in the sub-menu “Current Lost Items” will be deleted from the system. When unchecked, duplicate data in the “Current Lost Item” sub-menu will be marked with a “Missing” status. This sub-menu can only be executed by super admin account. img", "folder": "Modules/6_Stocktake/initialize"}, {"path": "Modules/7_Masterfiles/0. Master files Introduction.html", "title": "0. Master files Introduction", "content": "tmpc6heg9se The Master File menu is used to manage look-up files that act as authority files for cataloguing , such as GMD, publisher, author, subject, and so on. Master file settings are useful for simplifying the library manager’s work in processing bibliographic data, and ensuring consistency and data integrity. A valuable explanation on the role of authority files in cataloguing and optimising user searching can be found at https://www.scisdata.com/connections/issue-99/the-lowdown-on-authorities-and-authority-files/ In this module we can enter the master file data that can be used in bibliographic data entry, and also manage it. The data that is defined in this Master File module is: GMD General Material Designation Content type Media type Carrier type Publisher Supplier Author Subject Location Place Collection type Doc. language Label Frequency The following tools are also provided to help manage some authority files, and other settings. Visitor room Comment management Cataloguing Servers Item code pattern Orphaned author Orphaned subject Orphaned publisher Orphaned place", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/1. GMD.html", "title": "1. GMD", "content": "tmpco1u3luz This sub-menu is used to manage the GMD authority file . GMD : General Material Designation – The physical form of the media item . While this was utilised in AACR2 cataloguing, it was superseded in RDA cataloguing by content, media, and carrier terms. SLiMS retains this functionality for libraries still using AACR2 standards, but if choosing to use it, libraries should adhere to the standard GMDs which are already provided . gmd1 The interface allows sorting by clicking on the head of the columns. gmd3 If you wish to edit an entry you must select it , click the little edit pen button, and then on the resulting screen also click the EDIT button to enable editing. It’s a type of “safety mechanism”. There is a possible exception to the strong suggestion not to alter the GMD records. If you use Z39.50SRU copy-cataloguing, the Library of Congress will provide a GMD = “print” when you download most book records. That will result in SLiMS creating another GMD entry for “print”, and without a GMD code. To avoid this, it is best to EDIT the existing record for “Text”. You should retain the GMD code = TE , but edit the GMD name to “Print”. This will allow correct GMD insertion for Z39.50 downloads. gmd2 SLiMS does not translate master file entries. If you do not choose to use English terms, you should edit the records in the master-file to the equivalent term in your preferred language. Be aware that if using Z39.50 copy-cataloguing from LOC, downloads will create additional entries in the GMD master-file in English, if SLiMS can’t find the GMD NAME in the master-file. The layout and function of this module interface is similar to other master-file entry/management screens.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/10. Place.html", "title": "10. Place", "content": "tmpfsb5phcj This sub-menu is used to manage the Place lookup file . This look-up table contains the authoritative list of places of publication used in the catalogue. Place list This function enables management of the place master-file. It displays the list of places of publication ( e.g Chiang Mai, Thailand ; Brisbane, Australia etc. ) in the lookup table , with data for: Place name (authoritative geographic name for the place of publication) Last update (when the record was last edited) place1 If you wish to edit an entry you must select it , click the little edit pen button, and then on the resulting screen also click the EDIT button to enable editing. It’s a type of “safety mechanism”. A search function allows you to search for entries by place-name keywords. Results can be sorted by clicking on the field name at the top of each column. Add new place This provides the facility to add places directly to the data in the Senayan system. Places’ information includes the fields listed above, with the exception of Last updated , which is done automatically when the Save button is clicked. place2 Adding a place to the master-file can also be done during the cataloguing data input if the place is not found during the place data input for a new title. SLiMS does not translate master file entries. Delete place A place must be selected first, and after clicking the DELETE SELECTED DATA button a requester will appear, asking for confirmation. If the place is in use in any existing catalogue records, it cannot be deleted, and a notification will appear. place3 The layout and function of this module’s interface is similar to other master-file entry/management screens. Notes: Copy-cataloguing from Library of Congress may introduce strange two or three letter codes, which represent just the country code in MARC (see https://www.loc.gov/marc/countries/countries_code.html) Such entries will require manual editing. The place of publication name should reproduce the place of publication as given on the title page or in other bibliographic data ( e.g C.I.P) provided by the resource.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/12. CollectionType.html", "title": "12. CollectionType", "content": "tmp7yjixgwk This sub-menu is used to manage the Collection Type lookup file . Resources owned by the library, can be grouped by type, for example: Textbook, Reference, Fiction. These collection types are used when setting Loan rules in the Circulation module e.g An item of type = Reference might be restricted to only one day loan, or to a special group of library members. Collection type list This menu enables management of the collections type master-file. It displays the list of all collection types in the SLiMS database , with data for: Collection type ( name of the collection category) Last update ( When record was last edited) This section is provided with facilities to DELETE and EDIT collection data. To edit an item , double-click on the collection type , or single-click on the pencil (edit) icon. A search function allows you to search for entries by keywords. Results can be sorted by clicking on the field name at the top of each column. Add new collection type This provides the facility to add new collection types into the SLiMS system. Delete collection type A collection type must be selected first, and after clicking the DELETE SELECTED DATA button a requester will appear, asking for confirmation. If the collection type is in use in any existing catalogue records, it cannot be deleted, and a notification will appear.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/13. Document Language.html", "title": "13. Document Language", "content": "tmp4dr71osk This sub-menu is used to manage the Document Language lookup file . Catalogued resources can be tagged to indicate the main language used. This lookup table holds data on the possible languages Language list This enables management of the document language master file. It displays the list of all languages available for selection when entering data about a document’s language in the SLiMS database , with data for: Language (name of the language) Last update (when the record was last edited) doc_language1 This section is provided with facilities to DELETE and EDIT language data. To edit an item , double-click on the language name , or single-click on the pencil (edit) icon. A search function allows you to search for entries by keywords. Results can be sorted by clicking on the field name at the top of each column. Add new language This provides the facility to add new document languages directly to the Senayan system. You must allocate a language code as well as the name of the language. The language code should be the ISO 639-2 or 3 code for the language you enter. These codes are detailed at : https://www.iso.org/iso-639-language-codes.html There is a more limited Library of Congress authority list at: https://www.loc.gov/marc/languages/language_code.html , which will ensure MARC compatibility. doc_language2 Notes: Copy cataloguing using Z39.50 data from the Library of Congress could insert a new language code into this table, but it may be inaccurate . In this case, create a new correct Document language entry, and then assign it to the title being catalogued, and delete the incorrect language. This is a lookup file for describing the language that a resource has been authored in. It does not affect the translation languages available for the SLiMS OPAC or administration interface. SLiMS does not translate master-file entries. So, while you should adhere to the language CODE (as advised above), you may enter a language name in translated form to meet user needs. Delete document language A document language must be selected first, and after clicking the DELETE SELECTED DATA button a requester will appear, asking for confirmation. If the document language is in use in any existing catalogue records, it cannot be deleted, and a notification will appear.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/14. Label.html", "title": "14. Label", "content": "tmp1p1sr41d This sub-menu is used to manage the Label lookup file . To provide specific information about a catalogued resource, labels can be defined using the label master-file function. These labels are primarily used to provide visual cues , and potentially hyperlinks, in the SLiMS OPAC. Some OPAC Themes DO NOT display Labels, but this data table is retained for compatability Label list This function enables management of the label master-file. It displays the list of labels ( e.g New title, favourite title, multimedia ) in the lookup table , with data for: Label description (description of the status seen by users) Label name (unique name for the label, used internally by SLiMS, in the form label-xyz ) Last update (when the record was last edited) label1 This section is provided with facilities to DELETE and EDIT label data. To edit a label , double-click on the label , or single-click on the pencil (edit) icon. A search function allows you to search for entries by label keywords. Results can be sorted by clicking on the field name at the top of each column. Add new label This provides the facility to add labels directly to the data in the Senayan system. Labels’ information includes the fields listed above, with the exception of Last updated , which is done automatically when the Save button is clicked. label2 Adding or editing a label also provides a File attachment facility, to install a graphic file to act as an icon for the label. The image should be in PNG format. In SLiMS 9.x the label graphic will be uploaded to /images/labels/ . The default images should be used as a guide for the size, style, and naming of any additional labels. The screenshot above shows the edit interface, to illustrate the naming convention . Delete label A label must be selected first, and after clicking the DELETE SELECTED DATA button a requester will appear, asking for confirmation. If the label is in use in any existing catalogue records, it cannot be deleted, and a notification will appear.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/15. Frequency.html", "title": "15. Frequency", "content": "tmpqc5xm9ip This sub-menu is used to manage the Frequency table . Lists the lookup frequencies for serial publications , such as journals and newspapers. SLiMS comes with most common frequencies for serial publications, as shown in the screenshot below. Frequency available Displays the list of available frequencies in the lookup table, with data for: Frequency (text description of the frequency) Language (optional, specifies the language from the available document languages) Time increment (the interval between issues in time units) Time unit ( day/week/month/year) Last update (when record was last edited) frequency1 This section is provided with facilities to DELETE and EDIT frequency data. To edit an item , double-click on the frequency, or single-click on the pencil (edit) icon. A search function allows you to search for entries . Results can be sorted by clicking on the field name at the top of each column. Add new frequency This provides the facility to add new frequencies directly to the data in the SLiMS system. Frequency information includes the fields listed above, with the exception of Last updated , which is done automatically when the Save button is clicked. Delete frequency A frequency must be selected first, and after clicking the DELETE SELECTED DATA button a requester will appear, asking for confirmation. If the frequency is in use in any existing catalogue records, it cannot be deleted, and a notification will appear. It is recommended that you don’t delete the default frequencies, as they may be required for future acquisitions.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/16. Visitor Rooms.html", "title": "16. Visitor Rooms", "content": "tmp5lc61vem This sub-menu is used to manage the Visitor rooms . Lists and manages the enabled Visitor rooms. Room list Displays the list of rooms, with data for: Room name Room code This section is provided with facilities to DELETE and EDIT Visitor rooms. To edit an item , double-click on the room, or single-click on the pencil (edit) icon. A search function allows you to search for entries . Results can be sorted by clicking on the field name at the top of each column. Add new room This provides the facility to add new visitor rooms directly to the data in the SLiMS system. Visitor Room information includes the fields listed above, [ the room code will be randomly generated ] with the exception of Last updated , which is done automatically when the Save button is clicked. Note: As of SLiMS 9.7.2 the Visitor room has no clear function.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/17. Comment Management.html", "title": "17. Comment Management", "content": "tmpgkkv_s7_ This sub-menu is used to manage the user Comments . Where the system allows signed-in members to leave comments and/or reviews in the OPAC for particular titles, this menu option allows library staff to manage comments. Comment list Displays the list of comments, with data for: Comment (includes the Title the comment relates to, and the content of the comment) Comment by (holds the name of the member who made the comment) Comment date ( the date the comment was entered) comment_manage1 This section is provided with facilities to DELETE comments. There is no provision for staff to edit comments. To edit an item , double-click on the comment, or single-click on the pencil (edit) icon. A search function allows you to search for entries . Results can be sorted by clicking on the field name at the top of each column.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/18. Cataloguing Servers.html", "title": "18. Cataloguing Servers", "content": "tmpwlwkig4n This sub-menu is used to manage the Cataloguing Servers . While SLiMS comes with a default setting for MARC SRU [ https://opac.perpusnas.go.id/sru.aspx] , and Z39.50 SRU [http://z3950.loc.gov:7090/voyager] , and the default P2P pointing at itself, provision is also made for setting up connections to other catalogue servers. Server list Displays the list of user servers, with data for: Server name (user-friendly name chosen by librarian) URI ( holds the address of the server ) Server ( the server type: P2P, Z3950 , Z3950 SRU, MARC SRU) Last Update catalog_servers1 This section is provided with facilities to DELETE and EDIT server data. To edit an item , double-click on the server name , or single-click on the pencil (edit) icon. A search function allows you to search for entries by keywords. Results can be sorted by clicking on the field name at the top of each column. Add new server This provides the facility to add new cataloguing servers directly to the Senayan system. catalog_servers2 Complete each field, choosing the server type from the drop-down list, then cl
