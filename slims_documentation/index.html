ick the SAVE button. Once a server has been added, it will be available in the appropriate copy-cataloguing method, as an item in the dropdown list to choose which server to use.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/20. Orphans.html", "title": "20. Orphans", "content": "tmpowvemys_ Orphaned Author, Orphaned Subject, Orphaned Publisher, Orphaned Place. These sub-menu items are used to manage orphaned entries in the database . Over time, titles may be deleted from the catalogue, and as a result entries in the master-files of Author, Subject, Publisher or Place may remain without any link to a resource held by the library. If staff wish to unclutter these master-files, the “orphaned” data entries can be identified with these tools, and deleted if considered no longer needed. The operation is the same for each tool to find orphaned entries in its master-file. Choosing the menu item, e.g Orphaned Author, will open the relevant list interface ( e.g Author List ), which has the same appearance as the usual master-file list, but displays just those entries which are orphaned . Example: Orphaned Author display list orphaned1 The orphaned entries that you decide should be removed can be selected and deleted in the normal fashion.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/3. Media Type.html", "title": "3. Media Type", "content": "tmp2xm9kq5z This sub-menu is used to manage the Media Type authority file . RDA Media Type definition: Categorizes library materials based on the general type of device (intermediation tool) required to view, play, or run the content, such as audio, computer, video, or unmediated. Examples: Audio, computer, video. media_type SLiMS comes with standard authoritative codes and Media Type names. It is strongly recommended that you only edit this master file if there has been a change in the official standards [ seehttps://www.loc.gov/standards/valuelist/rdamedia.html ] . Do not delete entries. If you wish to edit an entry you must select it , click the little edit pen button, and then on the resulting screen also click the EDIT button to enable editing. It’s a type of “safety mechanism”. SLiMS does not translate master file entries. If you do not choose to use English terms, you should edit the Media Type Name in the master-file to the equivalent term in your preferred language. Do not alter the single-character codes. The layout and function of this module’s interface is similar to other master-file entry/management screens.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/4. Carrier Type.html", "title": "4. Carrier Type", "content": "tmpg24ukvd6 This sub-menu is used to manage the Carrier Type authority file . RDA Carrier Type definition: These are categorized formats describing the physical storage medium and housing of a resource, combined with the intermediation device needed to view or play it. Examples: videodisc, volume, online resource, etc. carrier_type SLiMS comes with standard authoritative codes and Carrier Type names. It is strongly recommended that you only edit this master file if there has been a change in the official standards [ see https://www.loc.gov/standards/valuelist/rdacarrier.html ] . Do not delete entries. If you wish to edit an entry you must select it , click the little edit pen button, and then on the resulting screen also click the EDIT button to enable editing. It’s a type of “safety mechanism”. SLiMS does not translate master file entries. If you do not choose to use English terms, you should edit the Carrier Type Name in the master-file to the equivalent term in your preferred language. Do not alter the two-character codes. The layout and function of this module’s interface is similar to other master-file entry/management screens.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/5. Publisher.html", "title": "5. Publisher", "content": "tmp95611v4y This sub-menu is used to manage the Publisher authority file . This look-up table contains the authoritative list of publishers used in the catalogue. Publisher list This function enables management of the publisher master-file. It displays the list of publishers ( e.g Penguin , CSIRO Publishing, etc ) in the lookup table , with data for: Publisher name (authoritative name of the publisher) Last update (when the record was last edited) publisher1 This section is provided with facilities to DELETE, ADD, and EDIT publisher data. If you wish to edit an entry you must select it , click the little edit pen button, and then on the resulting screen also click the EDIT button to enable editing. It’s a type of “safety mechanism”. A search function allows you to search for entries by publisher keywords. Results can be sorted by clicking on the field name at the top of each column. Add new publisher This provides the facility to add publishers directly to the data in the Senayan system. Publishers’ information includes the fields listed above, with the exception of Last updated , which is done automatically when the Save button is clicked. Adding a publisher to the master-file can also be done during the cataloguing data input for a new title if the publisher is not found to exist in the master-file during the publisher data input. In that case, the option to Add the publisher will be presented to the cataloguer, so care should be taken to enter data correctly as the name will then be added to the master-file. SLiMS does not translate master-file entries. Data is displayed as it has been entered. Delete publisher A publisher must be selected first, and after clicking the DELETE SELECTED DATA button a requester will appear, asking for confirmation. If the Publisher Name is in use in any existing catalogue records, it cannot be deleted, and a notification will appear, like below: publisher2 Note: As of SLiMS 9.7.2, it is possible for copy-cataloguing or other data imports ( e.g. direct sql file inputs to the database) to create an empty record in the Publisher Name field, as illustrated in the Publisher List above. Such a record cannot be deleted via the master-file module easily , nor searched for readily . As a workaround, select EDIT and then insert a character such as “.” or “_“, as the Publisher Name. It should SAVE successfully. You can then search for any catalogue records using that publisher name. Alternatively, such a record can be ignored and left, or removed by resorting to database tools such as phpMyAdmin.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/6. Supplier.html", "title": "6. Supplier", "content": "tmp_02suoz9 This sub-menu is used to manage the Supplier authority file . This look-up table contains the authoritative list of suppliers used in the system to record acquisitions. Supplier list This function enables management of the supplier master-file. It displays the list of suppliers e.g individual bookstores, Amazon etc. in the lookup table , with data for: Supplier name Contact Phone number Fax number Last update (when the record was last edited) supplier1 This section is provided with facilities to DELETE, ADD, and EDIT supplier data. To edit a supplier , double-click on the supplier , or single-click on the pencil (edit) icon. When you edit a supplier, you will also have access to additional fields: Address Account number Email Address A search function allows you to search for entries by supplier keywords. Results can be sorted by clicking on the field name at the top of each column. Maintaining a list of suppliers facilitates ordering and reordering of resources, and creating an entry for a supplier in this master-file allows for the supplier to appear in the drop-down Supplier list when adding an Item (copy) of a title, during cataloguing. supplier3 Add new supplier This provides the facility to add suppliers directly to the data in the Senayan system. Suppliers’ information includes all of the fields listed above, with the exception of Last updated , which is done automatically when the Save button is clicked. supplier2 Delete supplier A supplier must be selected first, and after clicking the DELETE SELECTED DATA button a requester will appear, asking for confirmation.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/7. Author.html", "title": "7. Author", "content": "tmpo9ace9ys This sub-menu is used to manage the Author authority file . This look-up table contains the authoritative list of Authors used in the catalogue. This menu enables management of the Authors master file. It displays the list of all authors in the SLiMS database , with data for: Author name (name of the author) Author year (birth year of the author) Authority type (can be person/organisation/conference, and corresponds to MARC 1XX fields) Authority files (source, eg. Library of Congress, MLA authority, etc) Last update (when record was last edited) This section is provided with facilities to DELETE and EDIT author data. author1 If you wish to edit an entry you must select it , click the little edit pen button, and then on the resulting screen also click the EDIT button to enable editing. It’s a type of “safety mechanism”. A search function allows you to search for entries by author-name keywords. Results can be sorted by clicking on the field name at the top of each column. Add new author This provides the facility to add authors directly to the data in the Senayan system. Authors’ information includes the fields listed above, with the exception of Last updated , which is done automatically when the Save button is clicked. author2 Adding an author to the master-file can also be done during the cataloguing data input for a new title if the author is not found to exist in the master-file during the author data input. In that case, the option to Add the author will be presented to the cataloguer, so care should be taken to enter data correctly as the name will then be added to the master-file. SLiMS does not translate master-file entries. Data is displayed as it has been entered. Delete author An author must be selected first, and after clicking the DELETE SELECTED DATA button a requester will appear, asking for confirmation. If the author name is in use in any existing catalogue records, it cannot be deleted, and a notification will appear.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/7_Masterfiles/8. Subject.html", "title": "8. Subject", "content": "tmpemdprmzi This sub-menu is used to manage the Subject authority file . This look-up table contains the authoritative list of subjects used in the catalogue along with cross-referencing. Subject list This enables management of the subjects master-file. It displays the list of all subjects in the SLiMS database , with data for: Subject Class. code (optionally allocate a classification code) Subject type (Topic/Geographic/Name/Temporal/Genre/Occupation) Authority files (source, eg. Library of Congress ) Last update (when record was last edited) This section is provided with facilities to DELETE and EDIT subject data and options to ADD a new subject or create Cross-reference entries. subject1 If you wish to edit an entry you must select it , click the little edit pen button, and then on the resulting screen also click the EDIT button to enable editing. It’s a type of “safety mechanism”. A search function allows you to search for entries by subject keywords. Results can be sorted by clicking on the field name at the top of each column. Add new subject This provides the facility to add subjects directly to the data in the Senayan system. Subject information includes the fields listed above, with the exception of Last updated , which is done automatically when the Save button is clicked. subject2 Adding a subject to the master-file can also be done during the cataloguing data input for a new title if the subject is not found to exist in the master-file during the subject data input. In that case, the option to Add the subject will be presented to the cataloguer, so care should be taken to enter data correctly as the subject will then be added to the master-file. SLiMS does not translate master-file entries. Data is displayed as it has been entered. Cross reference This button opens another screen to give access to functions managing cross-reference codes and descriptions only. SLiMS already has the essential cross-reference terms installed, and it should not normally be necessary to alter or add to these . cross-reference1 Vocabulary control To implement cross-referencing / vocabulary control, EDIT existing subjects. The edit screen provides access to Vocabulary control data entry. cross-reference2 The Add new vocabulary button will open a pop-up , which then allows subject cross-references to be created. cross-reference3 The Scope note button will open a pop-up , which then allows a scope note to be entered. References and scope notes can be edited or deleted. cross-reference4 Delete subject A subject must be selected first, and after clicking the DELETE SELECTED DATA button a requester will appear, asking for confirmation. If the subject is in use in any existing catalogue records, it cannot be deleted, and a notification will appear. Note: As of SLiMS 9.7.2, it may be possible for copy-cataloguing or other data imports ( e.g. direct sql file inputs to the database) to create an empty record in the Subject field. Such a record cannot be deleted via the master-file module easily , nor searched for readily . As a workaround, select EDIT and then insert a character such as “.” or “_“, as the subject. It should SAVE successfully. You can then search for any catalogue records using that subject. Alternatively, such a record can be ignored and left, or removed by resorting to database tools such as phpMyAdmin.", "folder": "Modules/7_Masterfiles"}, {"path": "Modules/8_System/00_system configuration.html", "title": "00_system configuration", "content": "tmp7inzt_ic System configuration Using this form you can make changes to the global preferences in SLiMS applications, such as: - Library name (Name of library, appears in OPAC and printed items such as labels and cards) - Library sub-name (Additional library name, optional) - Logo image (Library logo image file, can be uploaded, may be used in OPAC and member cards) - Default application language (Language that Admin. modules are displayed in, and is OPAC default) - Default application timezone (These must be timezones supported by PHP) - Search engine (Choose search engine, and configure if allowed) - Number of titles to show in OPAC result list (Number of titles that will be displayed on every page in the OPAC) - Show promoted titles on homepage (Showing title of resource in the home page of the OPAC) - Quick return [Enable/Disable] (to allow the return of items via a quick method; default=Enable) - Print circulation receipt [Print/Don’t print] (default= Don’t print) - Loan and due date - Manual change [Enable/Disable] (default = Disable) - Loan limit override [Enable/Disable] (ability for staff to override limits; default=Disable) - Ignore holidays fine calculation [Enable/Disable] (whether to count holidays in calculating fines; default=Disable) - OPAC XML detail [Enable/Disable] (allow XML display of title detail; default=Enable) - OPAC XML result [Enable/Disable] (allow XML display of search results; default=Enable) - Enable SEARCH spellchecker [Enable/Disable] (default=Enable) - Allow OPAC file download [Allow/Forbid] (allow/forbid users to download title file attachments) - Session login timeout ( set time before a logged-in user is automatically logged out) - Remember me Timeout ( days before the “remember me” token will expire) - Barcode encoding [ Code 128/Code 38] (set the encoding system used for barcodes) - Visitor counter by IP [Enable/Disable] ( enabling will restrict which IP’s can access the visitor page) - Allowed counter IP ( allowed IP address for counter - default is 127.0.0.1) - Visitor limitation by time [Enable/Disable] - Time visitor limitation [in minutes] (limits visitor to set time, if limitation is enabled) - Reserve method [Database/Email]. ( default is Database ). Sets method for making reservations. - Reserve for item on loan only [Enable/Disable] ( allow reservation only for those items that are already loaned) - Activate confirm alert? [ [Enable/Disable] (default=Enable) - Ignore SSL verification [Enable/Disable] (Allow insecure http connection; default=Enable) - To make a simple search even simpler, narrowing the search criteria. [No/Yes] (default is No) - Strong password policy [Yes/No] (default is Yes. Enforces minimum password requirements) - Password minimum characters (if strong password policy is Yes) ( set number of characters, default = 8) In this screen we can also see which version of SLiMS we are using. system_conf1 Notes: Show promoted titles on homepage feature on this system: if the check box is checked, the front page of the OPAC display will not show titles, unless there is a set of bibliographic data to display on the front page. See the Add new entry menu in the Cataloguing module, and the setting “Promote to Homepage” IMPORTANT When you have altered the System configuration, be sure to click the Save settings button before exiting or changes will be lost.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/01_system environment.html", "title": "01_system environment", "content": "tmpr8ovndku System environment This menu item will display a screen of details of the current environment in which SLiMS is running. This is extremely important for trouble-shooting and these details should always be included when asking for community support. system_env1", "folder": "Modules/8_System"}, {"path": "Modules/8_System/02_system environment setting.html", "title": "02_system environment setting", "content": "tmp8zkacqzl System environment setting This menu item allows the setting of the system environment mode. System Environment mode [Production/Development] (default = Production). Choosing Development will enable debug message details to be displayed if errors occur , and this mode should always be enabled when troubleshooting. Environment for some IP? [Enable/Disable] (default = Disable). If enabled, allows control of which IP addresses on which clients will see the debug messages. IP range … . The range of IP addresses that will be impacted if the above setting is enabled. If enabled, the range would usually be for fixed IP addresses of system administrator and/or librarian. Left empty, it will impact all addresses system_env_setting1", "folder": "Modules/8_System"}, {"path": "Modules/8_System/03_ucs configuration.html", "title": "03_ucs configuration", "content": "tmp73zrkybd UCS configuration This menu item allows the setting of preferences for Union Catalog Server usage. Unless you are using a Union Catalog server, you may leave all settings to default. Enable UCS [Enable/Disable] (default=Disable) Auto delete record [Enable/Disable] (default=Disable) - Automatically synchronise Auto insert record [Enable/Disable] (default=Disable) - Automatically synchronise Server address (default = http://localhost/ucs) - the address of your Union Catalog server Server ID (default = slims-node) − identifies server Server password ( a long password is provided by default - you should alter it) Server name (default = your library’s name) system_env_setting1 Don’t forget to SAVE settings before leaving the page", "folder": "Modules/8_System"}, {"path": "Modules/8_System/04_theme configuration.html", "title": "04_theme configuration", "content": "tmppr6q47v1 Theme configuration This menu item enables the configuration of both the OPAC and Admin themes, which deliver the look and feel of the interface. Public template This determines how the OPAC appears to users. Standard themes for the OPAC that are provided are “Akasia”, “Akasia-dz” (from version 8 of SLiMS), “default” ( Bulian fresh theme), and “Lightweight” ( which is particularly suited to mobile device clients and low bandwidth environments). Libraries can easily develop their own themes based upon these. theme_config1 Themes can generally be configured, after they are selected by clicking on the Activate button. At that point the button will change to Customise. Clicking the Customise button will open a pop-up with a range of settings. theme_config2 theme_config3 theme_config4 The screenshots above show the range of customisations for the default theme. Most are self explanatory. Other themes have reduced customising options. When you have configured the theme, be sure to click Save Settings . Important notes: If the default theme is customised and then subsequently another theme is tried, the customisation details are lost. It is recommended in particular that you take a copy of any custom google map data, and custom footer information before changing themes. In SLiMS 9.7.2 the default template options suggest you can change the number of Popular and New items shown in the OPAC. However this is not functional and 6 will always be displayed in the OPAC. Admin template This determines the appearance of the admin. interface that library staff work with. Customisation is limited. theme_config5 Additional themes can be created by the SLiMS community, and some may be found at : 🔗Go SLiMS If you wish to create your own theme, it’s recommended that you take a copy of the default theme as a basis for modification", "folder": "Modules/8_System"}, {"path": "Modules/8_System/05_plugins.html", "title": "05_plugins", "content": "tmpsgyagi7q Plugin list This menu item displays available plugins that have been installed in the SLiMS system, and allows you to Enable/Disable them individually. Data displayed is: Plugin (plugin name) Description (brief explanation of what the plugin does, its version, the author, and a link to more details) Enable/Disable (default=Disabled) plugins1 Note: Plugins are small additions which can be selectively installed in SLiMS to provided added functions to the core system. They are placed in the / plugins / directory and will then appear in this list. Some simple plugins are provided by default. [ This plugin system is an innovation introduced in SLiMS Bulian 9.3.0 by Mas Ido Alit. The goal of this innovation is to simplify the work of SLiMS developers ,both users and those assisting users, in upgrading SLiMS from the current version to a more advanced one. ] The method for creating plugins for SLiMS9.3X is documented at: https://slims.web.id/docs/development-guide/Plugin/Intro Some “plugins” for earlier versions of SLiMS are available at : https://go.slims.id/?page_id=583&skw=plugin&orderby=date&order=desc . These may not be compatible with the latest versions of SLiMS, and cannot be managed by this menu.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/06_custom field.html", "title": "06_custom field", "content": "tmpxmegwdm8 Custom field editor This menu item allows the creation of additional custom fields within certain tables in the database, adding submenu items in Bibliographic , Item , and Membership areas of SLiMS. For a custom field, you can specify Primary menu [Cataloguing/Catalogue item/Membership] (default=Cataloguing) Label - required, as this is the name of the field Input type [Text/Text area/Numeric/Drop-down/Check-list/Choice/Date] Is public [Show/Hide] (default=Show) - whether the field is visible in OPAC Custom style [] Note - Text area for documenting the field function etc custom1 This section is provided with facilities to DELETE and EDIT custom field data. If you wish to edit an entry you must select it , click the little edit pen button, and then on the resulting screen also click the EDIT button to enable editing. It’s a type of “safety mechanism”. Editing an existing field will delete any existing data in the associated table(s). A search function allows you to search for custom fields by Label keywords. Results can be sorted by clicking on the field name at the top of each column. Add new field This provides the facility to add fields to the database in the SLiMS system. Field information includes the aspects listed above, custom2 SLiMS will not translate your custom field Label without additional work on the translation files. Data is displayed as it has been entered. Delete custom field A custom field must be selected first, and after clicking the DELETE SELECTED DATA button a requester will appear, asking for confirmation.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/07_currency setting.html", "title": "07_currency setting", "content": "tmpfjgk9r89 Currency configuration This menu item allows the setting of the system-wide currency if desired. Enable system currency? [Yes/No/] (default = Yes). Currency options will also be affected by the array configured in sysconfig.inc.php Region [Choose from a dropdown list] . This is reliant on the PHP “intl” extension being enabled and functioning. Number of decimal places (default = 0). Allows for currencies that may require decimal divisions for accurate pricing. currency1 Be sure to click Save Settings before exiting.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/08_e-mail setting.html", "title": "08_e-mail setting", "content": "tmp4tzwwoin E-Mail configuration This menu item allows the setting of preferences for E-Mail. Enabling connection to an SMTP server will permit issuing of notices to library members via email. Environment [Production/Development] (default=Production) SMTP encryption - specify the encryption used for the connection SMTP server address - specify the address of the mail server that will send your emails SMTP port - specify the port you will connect to on the server Authentication username - specify the username you will use to connect to the server Authentication password - specify the password associated with the username above for the connection Email sender’s address - specify the email address that the email is sent by Email sender name - specify the name that appears as sender in the email “Reply to” same as email sender [Yes/No] - *choose if the “Reply To” name is different email1 Don’t forget to SAVE settings before leaving the page", "folder": "Modules/8_System"}, {"path": "Modules/8_System/09_captcha setting.html", "title": "09_captcha setting", "content": "tmpk44h8nst Captcha configuration This menu item allows the setting Captcha security if desired. This can be important in preventing automated logon attempts for public SLiMS OPACS. SLiMS installations that are not exposed to the Internet will have less requirement for this. The available settings are: Default captcha provider (default = ReCaptcha). In v.9.7.2 only ReCaptcha is offered . Enable for section [Choose for librarian and/or memberarea ] . Sections enabled will require Recaptcha response at login. Provider Option : Enter Public key and Private key. These will need to be generated for your specific domain. See https://developers.google.com/recaptcha/intro captcha1 Be sure to click Save Settings before exiting.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/11_biblio indexes.html", "title": "11_biblio indexes", "content": "tmpmlb6iydi Bibliographic indexes This function is used to index the catalogue tables used by SLiMS. Given this indexing, the search performance of SLiMS will be improved. There are three functions in this menu: - Emptying index (clear the existing index results) Re-create index (re-index the catalogue data) Update the index (to index new bibliographic data that has not yet been indexed) biblio_indexes1 Data is also displayed, giving the total number of catalogued title records, the total of those that are indexed, and the number of unindexed records. This index is used by the SLiMS SearchBiblioEngine. You can locate the setting for Biblio Indexing type within sysconfig.inc.php . . This interracts also with the System Configuration Search engine option", "folder": "Modules/8_System"}, {"path": "Modules/8_System/12_modules.html", "title": "12_modules", "content": "tmp4_knaov5 Modules Provides the functions of : - Module list (listing existing modules) - Search (search for a module) - Edit and Delete modules - Add new modules (add a module). The usual facility to sort the list by clicking on a field name is available. modules1 To add a module, the new module folder containing the code must already be placed in the folder admin/modules/ . Then click the Add new modules button, and fill in the information of the new module, namely: - Module name (the name of the module), Module path (path/location of the module), Module description (brief description of the module) When the fields are completed, click the Save button It’s strongly suggested that you don’t delete or significantly edit the module entries provided, because they provide SLiMS functions. The contents of the Module description s are not translated in SLiMS, and so these might be edited appropriately if your library administration is carried out in a language other than English.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/13_user group.html", "title": "13_user group", "content": "tmp9ond8yca User groups A facility to define groups of users. In this you can create groupings of your system Admin users and grant read (Read) or Write (Write) permissions for the Senayan modules. Each user can be placed in more than one group. user_group1 Provides the functions of: Group list (listing existing security groups) Search (search for a group) Edit and Delete groups Add new groups (add a group). The usual facility to sort the list by clicking on a field name is available. To add a group click the Add new group button, and fill in the information of the new group, namely: Group name (the name of the group), Privileges (Both Modules and submenu item access controls are possible), When the selections are completed, click the Save button user_group2 This facility allows the System administrator to control staff access to functions according to their skills and responsibilities.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/14_library system users.html", "title": "14_library system users", "content": "tmpwwp3jbtw Librarian & system users A facility to determine which users can access the system, according to their permissions. These users will be able to perform a login with username and password. This menu item contains the options: Add new user (adding users), User list (list of users), Search (search for a user), Edit and Delete user. The user list displays the following information for each user: Real name (the user’s real name) Login username (the login name allocated to the user) User type [Senior Librarian/Librarian/Library staff] Last login (when the user last logged in) Last update (when the record was last updated) The list may be sorted by any of these fields by simply clicking on the field name at the top of the column. E.g to sort by User type , simply click “User type”. A search function exists which will search the user list for users matching the keywords This facility can also be used to edit and delete items. To edit an item , double-click on the title , or single-click on the pencil ( edit) icon. library_system_users1 Within user information, a user can also add their internet credentials, e.g. Facebook profile, blog or websites, etc. To add a new user, click Add New User, and then fill in the Login username, Real name, User type ( that they will belong to), and Password. If a password policy has been set, the password must conform to it. These fields are mandatory. Optionally, you may enter information on Email address, various social media accounts such as Facebook, blog address etc. A User photo may be uploaded or captured using the built-in camera function if available. Checkboxes permit optional allocation to security Group(s): e.g Admin , Circulation, Librarians, Visitors etc that have been previously created via the User Group option, This allows the system administrator to determine which menu items are available to the logged-in library staff. library_system_users2 Be sure to Save the record before exiting the screen.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/15_image maintenance.html", "title": "15_image maintenance", "content": "tmpir8rrdmd Image maintenance A facility to manage issues arising over time that create inconsistencies between the database and the file system in SLiMS. During the library’s operation, some images and attached files, related to entries in the member , user , and biblio tables may be retained when entries are deleted. Such files can be termed “Ghosts”. Also some such files may be deleted without a corresponding change in the relevant database field - creating “Orphaned” entries. This menu item displays statics related to this : image_maintenance1 You can select the following maintenance actions : image_maintenance2 The normal practice with maintenance should be to follow the sequence Refresh statistics Find Orphans and Ghosts Clean up Image Maintenance also offers the option to Backup all images to a zip archive and this is a good practice to follow regularly, and certainly before deleting “ghost” image files.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/16_shortcut settings.html", "title": "16_shortcut settings", "content": "tmpjywvduo7 Shortcut settings Provides a facility to edit the Shortcut menu items that are presented in the Admin interface. Highlight an item in the left pane, and click the Select button. The item will appear in the right pane. Click the Save button, and your settings are saved and the item will appear in the Shortcut menu for Admin users. shortcut_settings1 To remove an item highlight it in the right pane, click the Move back button, and Save .", "folder": "Modules/8_System"}, {"path": "Modules/8_System/17_holiday setting.html", "title": "17_holiday setting", "content": "tmp_nkhweoc Holiday Settings A facility to determine days where the library is not open for service. Defining these holidays will effect calculation of weekdays that the library is active/open, and fine calculation if fines are implemented. There are two types of holidays that can be defined in this menu: - Regular days off (Monday till Sunday), and - Special holidays (defined by date, month and year). holiday_setting1 Clicking the Holiday setting button will show the days of the week, and the current setting for days off ( indicated by the checkbox.) To adjust the regular days of the week the library is closed, mark the checkbox(es) and click the Save settings button. To view special holidays already set, click the Special holiday button. This will display the list of special holidays with the day of the week, the start date of the holiday and the holiday description. The usual sorting and edit functions are provided. To add a special holiday, click the Add special holiday buttons and determine the date, month, year and description of the holiday. In addition, special holidays can also be configured for a range of dates (from the start date until the date of completion of holidays). holiday_setting2", "folder": "Modules/8_System"}, {"path": "Modules/8_System/18_barcode generator.html", "title": "18_barcode generator", "content": "tmphbepw6ph Barcode generator A simple utility to allow production of barcodes in addition to the “ Item Barcode Printing ” and the “ Member card printing ” facilities. barcode_generator1 Enter the code that will be made into barcodes in the columns on the screen. Determine the size of the barcode (Small, Medium, or Big), and click the Generate barcode button. Then these will be displayed in the form of a barcode , in a popup, and can be printed in a printer. The default encoding used is barcode 128B. You can modify this barcode encoding in the Senayan global configuration file , sysconfig.inc.php . Note: The characters that can be processed in the Barcode generator are just the ASCII alphanumeric character set.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/19_system log.html", "title": "19_system log", "content": "tmpxynxh596 System Log This is a menu to view the recorded events on the Senayan system. Records for each event that are produced show : Time Location (module name) Message (description). Messages that appear in the system logs include who (User/Administrator) conducted what ,and where. When the SLiMS application is used, it will automatically log the SLiMS work and the log size and load will also increase. Therefore, the system log function also contains the facility to Save logs to file . This process will save the existing log, and then the logs can be cleared by clicking the Clear logs button.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/20_backup.html", "title": "20_backup", "content": "tmpnpzw7qqo Database backup A facility to backup the SLiMS database. One of the most important facilities. The screen displays details of existing backups, with fields as follows: Backup executor (the user who initiated the backup) Backup time (the time and date the backup was created) Backup file location (the path to the backup file and its name ) File size (the size of the backup) To create a backup, click the Start new backup button and SLiMS will back up automatically. The format of backup files created by SLIMS is .sql in layout and compressed using TAR.GZ . They are named according to the creation date and store within the directory files/backup . database_backup1 Backup files can be downloaded by clicking the Download button. Database backup can be configured by clicking the Backup configuration button. This will launch a popup showing settings for Reminder [ Enable/Disable] (default=Enable) - will show reminder on Admin Home Page Auto [ Enable/Disable] ( default = Disable) - can automate backup, but may lead to unnecessary backups and storage issues unless monitored Advanced Options - it is strongly suggested that these are left unaltered unless you have special requirements and also have database administration expertise. The default settings will produce the best resulting SQL for most situations. database_backup2 Unwanted backups can be deleted by selection using the checkbox, followed by clicking on the Delete selected data button. The normal search and sort functions are available to manage a large number of backups. Backups should be carried out regularly and methodically according to a well-planned schedule. A general rule of thumb when determining when to back-up is to assess how much data you are prepared to lose, and be required to re-enter, AND the possible consequences of lost data e,g lost circulation records. When library staff log-in to SLiMS they will normally be advised if a daily backup has NOT been made, and if they have the correct permissions, they can initiate a backup directly from the Admin Home page. A full database backup provides one of the key functions for migrating a SLiMS system to a new server, and for recovery from system failure, or major errors. Note: To do this backup, the mysql database user must have the right to LOCK TABLES . This will be normally the case if the SLiMS installer has been used to create the SLiMS system. Note: This function backs-up the SLiMS database only. Uploaded content such book covers images, attached files, member photos etc., must be backed-up separately. The “Image maintenance” menu option provides a backup facility for some of these files.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/content.html", "title": "content", "content": "tmp82o3d8v0 Content This function is used to change the appearance of the SLiMS application content. By default, contents that already exist and can be modified via this screen are: - Homepage info , (located at the front of the OPAC & displayed when “Home” is clicked) - Welcome to Admin page [the initial display when entering the Admin menu - SLiMS management console] - Help on usage (accessed from the OPAC) - Library information (also accessed from the OPAC) Example of usage: consider a path created for the new content that is stored as ‘ librarian ’. On a SLiMS system accessed by the URL http://localhost/slims , to display this content then we need to write the url: http://localhost/slims/index.php?p=librarian We can create the navigation to this URL in the OPAC by editing the OPAC template. Information displayed in the Content list: Content title (user-friendly title for the content) Path (must be unique) (a variable) Last updated (generated automatically) The usual facility to sort the list by clicking on a field name is available. To add new a new content item click the Add new content button . An editor screen will open requiring you to enter : Content title [required] This is news [Yes/No] Path (must be unique) [ ] Content description [ this is the actual content and can be edited as html , using the inbuilt WYSIWYG editor which provides a wide range of functions including image insert, text formatting, and source editing ] When the fields are completed, click the Save button. The usual edit and search functions are also available.", "folder": "Modules/8_System"}, {"path": "Modules/8_System/envinfo.html", "title": "envinfo", "content": "tmpyt6rsstk System environment This screen displays relevant information about the particular SLiMS installation and its hosting environment. This data is especially relevant when troubleshooting an installation, and should be provided when requesting support in forums etc. Variables displayed are: SLiMS version ( the version of SLiMS running , as read from the sysconfig file) Operating system (of the host) OS Architecture (e.g. x86_64 64 bit) Web server (the application on the server which is serving webpages for SLiMS) PHP version (the version of PHP language running on the SLiMS server) MySQL database version (the version of MySQL compatible database running on the server) MySQL client version (the version of MySQL client installed on the server) Browser/User agent (information on the browser and system that you are using to view this data) Hostname (the domain or host name of the server) jQuery version (the version of jQuery being used) HTML5 support? (whether HTML5 support is available on the system, and enabled)", "folder": "Modules/8_System"}, {"path": "Modules/8_System/ucsetting.html", "title": "ucsetting", "content": "tmpdytawd7i System configuration Using this form you can make changes to the settings for UCS ( Union Catalog Server) usage. By connecting to a union catalog server OPAC results will reflect collection holdings of other libraries participating in the Union catalog, facilitating inter-library loans, and copy cataloguing. The configurable settings are: Enable UCS [Enable/Disable] (enabling of UCS functions) Auto delete record [Enable/Disable] (s) Auto insert record [Enable/Disable] (s) Server address (UCS server address) Server ID (UCS server connection ID) Server password (UCS server connection password) Server name (UCS server name)", "folder": "Modules/8_System"}, {"path": "Modules/8_System/working/captchasetting.html", "title": "captchasetting", "content": "tmp29htyyfx Database backup A facility to backup the SLiMS database. The screen displays details of existing backups, with fields as follows: Backup executor (the user who initiated the backup) Backup time (the time and date the backup was created) Backup file location (the path to the backup file and its name ) File size (the size of the backup) To create a backup, click the Start new backup button and SLiMS will back up automatically. The format of backup files created by SLIMS is .sql in layout and compressed using TAR.GZ . They are named according to the creation date and store within the directory files/backup . Backup files can be downloaded by clicking the Download button. Unwanted backups can be deleted by selection using the checkbox, followed by clicking on the Delete selected data button. The normal search and sort functions are available to manage a large number of backups. Backups should be carried out regularly and methodically according to a well-planned schedule. A full database backup provides one of the key functions for migrating a SLiMS system to a new server, and for recovery from system failure. Note: To do this backup, the mysql database user must have the right to LOCK TABLES . Note: This function backs up the SLiMS database only. Uploaded content such book covers images, attached files, member photos etc., must be backed-up separately.", "folder": "Modules/8_System/working"}, {"path": "Modules/8_System/working/currencysetting.html", "title": "currencysetting", "content": "tmp_a4r19c4 Database backup A facility to backup the SLiMS database. The screen displays details of existing backups, with fields as follows: Backup executor (the user who initiated the backup) Backup time (the time and date the backup was created) Backup file location (the path to the backup file and its name ) File size (the size of the backup) To create a backup, click the Start new backup button and SLiMS will back up automatically. The format of backup files created by SLIMS is .sql in layout and compressed using TAR.GZ . They are named according to the creation date and store within the directory files/backup . Backup files can be downloaded by clicking the Download button. Unwanted backups can be deleted by selection using the checkbox, followed by clicking on the Delete selected data button. The normal search and sort functions are available to manage a large number of backups. Backups should be carried out regularly and methodically according to a well-planned schedule. A full database backup provides one of the key functions for migrating a SLiMS system to a new server, and for recovery from system failure. Note: To do this backup, the mysql database user must have the right to LOCK TABLES . Note: This function backs up the SLiMS database only. Uploaded content such book covers images, attached files, member photos etc., must be backed-up separately.", "folder": "Modules/8_System/working"}, {"path": "Modules/8_System/working/custom_field.html", "title": "custom_field", "content": "tmpiha97dej Database backup A facility to backup the SLiMS database. The screen displays details of existing backups, with fields as follows: Backup executor (the user who initiated the backup) Backup time (the time and date the backup was created) Backup file location (the path to the backup file and its name ) File size (the size of the backup) To create a backup, click the Start new backup button and SLiMS will back up automatically. The format of backup files created by SLIMS is .sql in layout and compressed using TAR.GZ . They are named according to the creation date and store within the directory files/backup . Backup files can be downloaded by clicking the Download button. Unwanted backups can be deleted by selection using the checkbox, followed by clicking on the Delete selected data button. The normal search and sort functions are available to manage a large number of backups. Backups should be carried out regularly and methodically according to a well-planned schedule. A full database backup provides one of the key functions for migrating a SLiMS system to a new server, and for recovery from system failure. Note: To do this backup, the mysql database user must have the right to LOCK TABLES . Note: This function backs up the SLiMS database only. Uploaded content such book covers images, attached files, member photos etc., must be backed-up separately.", "folder": "Modules/8_System/working"}, {"path": "Modules/8_System/working/envsetting.html", "title": "envsetting", "content": "tmprzn39r2b Database backup A facility to backup the SLiMS database. The screen displays details of existing backups, with fields as follows: Backup executor (the user who initiated the backup) Backup time (the time and date the backup was created) Backup file location (the path to the backup file and its name ) File size (the size of the backup) To create a backup, click the Start new backup button and SLiMS will back up automatically. The format of backup files created by SLIMS is .sql in layout and compressed using TAR.GZ . They are named according to the creation date and store within the directory files/backup . Backup files can be downloaded by clicking the Download button. Unwanted backups can be deleted by selection using the checkbox, followed by clicking on the Delete selected data button. The normal search and sort functions are available to manage a large number of backups. Backups should be carried out regularly and methodically according to a well-planned schedule. A full database backup provides one of the key functions for migrating a SLiMS system to a new server, and for recovery from system failure. Note: To do this backup, the mysql database user must have the right to LOCK TABLES . Note: This function backs up the SLiMS database only. Uploaded content such book covers images, attached files, member photos etc., must be backed-up separately.", "folder": "Modules/8_System/working"}, {"path": "Modules/8_System/working/mailsetting.html", "title": "mailsetting", "content": "tmpuwuxu7h_ Database backup A facility to backup the SLiMS database. The screen displays details of existing backups, with fields as follows: Backup executor (the user who initiated the backup) Backup time (the time and date the backup was created) Backup file location (the path to the backup file and its name ) File size (the size of the backup) To create a backup, click the Start new backup button and SLiMS will back up automatically. The format of backup files created by SLIMS is .sql in layout and compressed using TAR.GZ . They are named according to the creation date and store within the directory files/backup . Backup files can be downloaded by clicking the Download button. Unwanted backups can be deleted by selection using the checkbox, followed by clicking on the Delete selected data button. The normal search and sort functions are available to manage a large number of backups. Backups should be carried out regularly and methodically according to a well-planned schedule. A full database backup provides one of the key functions for migrating a SLiMS system to a new server, and for recovery from system failure. Note: To do this backup, the mysql database user must have the right to LOCK TABLES . Note: This function backs up the SLiMS database only. Uploaded content such book covers images, attached files, member photos etc., must be backed-up separately.", "folder": "Modules/8_System/working"}, {"path": "Modules/9_Reporting/class_recap.html", "title": "class_recap", "content": "tmpheb4p9qf Custom Recapitulations This menu displays the recapitulation of: - Titles, based on Classification, - GMD, - Collection Type or Language. This option can be set by selecting the recapitulation filter available. Senayan also supports recap for classifications not based on decimal numbers. For example, REF for reference. Custom Recapitulation - “ Print Current Page ” provides the facility to print reports, and “ Export to spreadsheet format ” to place the report in a spreadsheet.", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/dl_counter.html", "title": "dl_counter", "content": "tmpb0x4h_gh Attachment download report Displays a report of downloaded attachments, with options to Search, and apply filters for Title, ISBN, Author, Publication year, and Access date. The report can be printed or exported to spreadsheet format (.xlsx)", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/due_date_warning.html", "title": "due_date_warning", "content": "tmp_j8211ha Due Date Warning This report contains the items of the borrower that will be due within 3 days .", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/fines_report.html", "title": "fines_report", "content": "tmpke08yq27 Fines Report This is a report based on the numbers of members fined each day.", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/item_titles_list.html", "title": "item_titles_list", "content": "tmpqhya4fc5 Items title list Displays a list of all items, with their titles. Each record provides : Item code Title Collection type Item status Call number The list may be sorted by any of these fields by simply clicking on the field name at the top of the column. E.g to sort by item code, simply click “Item code”. 20 records are displayed per page, and may be printed by clicking the Print current page button . In this menu, filtering can also be done, by entering the Title/ISBN, or by other filters. You do this by clicking Show More Filter Options . Available filters are: Title/ISBN Item Code Classification Collection Type Item Status Location After entering filter data, click Apply filter . These filter facilities can be re-hidden by clicking Hide More Filter Options .", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/item_usage.html", "title": "item_usage", "content": "tmpw7bzawuo Item Usage This is a report that lists the item, and how many times the copy has been borrowed on a monthly basis. Item usage also can be filtered by: - Title/ISBN, - Item code, or - Year.", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/loan_by_class.html", "title": "loan_by_class", "content": "tmphrnxf919 Loan by Classification This is a classification-based lending report. In addition to classes 0-9, the report also makes possible class-based reporting and Non-Decimal Class 2X. Loans can be filtered by: - Class, - Type, and - Year. This feature also provides the facility to create a spreadsheet file download. Files can be obtained by clicking “ Export to spreadsheet format ”.", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/loan_history.html", "title": "loan_history", "content": "tmpvgfibkw0 Loan History Contains data of every transaction ever undertaken. Resulting data records are comprised of: - Member ID , - Member name , - Item code , - Title , - Loan date , - Due date . In this menu the facility is also provided to print a list of the borrowing history. In addition it is also possible to perform a search of loan history data. Loan history data can be searched by: - Member ID/Member name , Title , Item code , Loan date from , Loan date until , Loan status, Location The number of records to display per page can be specified, between 20 & 200 This facility can be displayed by clicking the Show More Filter Options button, and activated by clicking the Apply Filter button. 🔗See Also: SLiMS online UserGuide", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/loan_report.html", "title": "loan_report", "content": "tmpcje_xjog Loan Report This report contains information on borrowing from the complete collection , with data on: Total loans Total loans, by GMD/media Total loans, by collection type Total loan transactions Transaction average (per day) Total peak transaction Members already having loans Members never having loans Total overdue loans Clicking the Download report button will generate a file containing the report, which will then be displayed for viewing, saving, or printing. Clicking either of the Show in chart/plot buttons will generate a graphic representation of the data , which will be displayed and can be printed or captured.", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/member_fines_list.html", "title": "member_fines_list", "content": "tmpzqdz_m9t Fines List by Member This allows you to search and produce a fines list for a member, with additional filters for membership type , and Fines date range .", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/member_list.html", "title": "member_list", "content": "tmp83y4_d7a Member List This contains a report/list of library members. In this menu there is a facility to sort and print. In addition, there are also filter amenities, ie based on: - Membership Type, - Member ID/Member Name, - Gender, - Address, - “Register Date From,” - “Register Date Until.” This feature also provides the facility to create a spreadsheet file download. Files can be obtained by clicking “Export to spreadsheet format”. 🔗See Also: SLiMS online UserGuide", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/member_loan_list.html", "title": "member_loan_list", "content": "tmph17ernob Loan List by Member This is a report that contains a list of items that are still borrowed by Members.", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/member_report.html", "title": "member_report", "content": "tmpeo8pcbcf Membership Report This report contains information on membership , with data on: - Total registered members Total active members Total members by members type Total expired members 10 most active members The time period for assessing the 10 most active members can be varied by selecting start and end dates for the range, and clicking Submit . The default for both is the current date. Clicking the Download report button will generate a .html file containing the report, which will then be displayed for viewing, saving, or printing. Commencing with Senayan3-stable14, the three types of report are equipped with a print feature of various Pie charts. You get this graph simply by clicking the “Show in Chart/Plot“ which appears in all three types of report (Statistics Collection, Loan Report, and Membership Report).", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/overdued_list.html", "title": "overdued_list", "content": "tmpxdb1agxi Overdue List A facility to find members with overdue loans status. Information displayed in this facility is: Member ID , Member name , Title , Days overdue , Loan date , Due date . From this menu you can also print, and search overdues. Overdues searches can be done by: - Member ID/Member name , - Loan date from , - Loan date until. 🔗See Also: SLiMS online UserGuide", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/procurement_report.html", "title": "procurement_report", "content": "tmpomarqno5 Procurement report Displays a collection procurement report, giving a table of Year received and Classifications broken into the Main Classes . There is a further subdivision of procurements into titles vs items in each Class, and totals are provided for years and Classes. Options buttons provide for obtaining procurement lists for each year, which can be exported in spreadsheet format; and for a procurement bar chart.", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/reserve_list.html", "title": "reserve_list", "content": "tmp78mn7j1a Reservation This menu is used to view a list of reservations by members. Information about the reservation displayed by this screen: - Item code - Title - Member - Reserve date Note : Reserved items are those that are not at hand in the library at that moment and not already loaned to the borrower. 🔗See Also: SLiMS online UserGuide", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/staff_act.html", "title": "staff_act", "content": "tmpnwc7zlvv Staff Activity This menu shows the activities of the library staff who have an account in application. The information shown is: Username, Login Name, Bibliography Data Entry, Items Data Entry, Member Data Entry, and Circulation. So this menu will make visible which staff did what, and how many times. To enhance the accuracy of the information, a filter is also provided that allows you to view activities from the start to the end date (as specified).", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/titles_list.html", "title": "titles_list", "content": "tmp505g32s7 Title List Contains reports/lists of titles held by the library. Information displayed is: Title Copies Place of publication Publisher ISBN Call number title-list1 In this menu there is a facility to sort and print, as well as a collection of desired filters. In this menu, filtering can also be done by writing the Title/ISBN, or by other filters. You do this by clicking Show More Filter Options . Existing filters are: Title/ISBN Author Classification GMD Input date Location and the number of records output per page can be specified title-list2 Note: a number of the other reports use a similar display, so screenshots are not currently included for them.", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/visitor_list.html", "title": "visitor_list", "content": "tmpscqkc3p0 Visitor List This report contains a list of names of library members or non-members who visit the library. This report contains information: - Member ID, - Visitor Name, - Membership Type, - Institution, and - Visit Date.", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/visitor_report.html", "title": "visitor_report", "content": "tmpcnec9lnj Visitor Statistic This is a report that contains statistics of library visitors. This report contains: - Member Type, and - Number of visits in each month in the year specified. Determination based on this year’s report can be done through the filter.", "folder": "Modules/9_Reporting"}, {"path": "Modules/9_Reporting/visitor_report_day.html", "title": "visitor_report_day", "content": "tmpnk8xp0ed Visitor Statistic (by day) This is a report based on the number of visitors per weekday.", "folder": "Modules/9_Reporting"}, {"path": "OPAC/1. OPAC Menus.html", "title": "1. OPAC Menus", "content": "tmpyr0be5s4 Access menu on SLiMS 9 Bulian no longer hidden, as in the previous versions. With the OPAC Classic template, the menus can be accessed at the top of the page. img The menus available are generally the same as the previous version. Information img Provides brief information about the library. Starting from the address, telephone number, to the types of collections provided by the library. In order to change the content of this page, you must have access to the SLiMS administration page. News img This page is intended as a page for delivering news on activities carried out by the Library. This page can be used as a simple Content Management System (CMS). With this feature, libraries can make coverage of library activities. Help img This menu provides a simple explanation of how to perform a search. Librarian img This menu provides the librarian’s profile information. Member Area img The Member Area menu makes it easy for users / visitors to be able to monitor loans that are still active and loan history. On this menu, users / visitors can also make reservations (ordering) library materials. Page Translation img In the upper right corner of the screen, there is a flag icon that provides the SLiMS interface language. The languages that are available by default are Arabic, Bengali, Brazilian Portuguese, English, Spanish, German, Indonesian, Japanese, Thai, Malay, Persian, Russian, Turkish, Urdu etc.", "folder": "OPAC"}, {"path": "OPAC/2. OPAC Parts.html", "title": "2. OPAC Parts", "content": "tmpydzdllvs In addition to the menus discussed earlier, some of the parts contained in the new SLiMS 9 Bulian template are: img Users simply select the icon according to the desired classification number. Click on the “see more” button to see what other classification icons look like. img In this template, a list of collections that are popular with readers appears. This section can be used as a reference by patrons when deciding to read a book. img This section becomes a storefront for books whose data has just been entered. Also displayed are books whose bibliographic data have improved. img To facilitate information on who the readers are the most diligent in reading, this section is provided. As a form of appreciation for users for using the library as a learning medium. img In the previous version, this information was provided on the Library Location menu, in SLiMS 9 Bulian, this information is displayed in a more informative display, so that users can immediately see the location and other information related to the library. img Users can see information about SLiMS at a glance. In this section, the user can also search (simply). Also displayed the menus that have been previously mentioned. A donation button is also provided, if the user wants to make a donation, supporting SLiMS development work.", "folder": "OPAC"}, {"path": "OPAC/3. Librarian Login.html", "title": "3. Librarian Login", "content": "tmpcu6pmwc3 In the SLiMS 9 Bulian version, login access to the SLiMS administration page is not displayed as in the previous version. Don’t worry though. Login access can be accessed by entering the address as shown below: img Or an easy way without having to remember the address, is to click on the link, for example “Information”, which will bring up the address http: //localhost/slims9_bulian/index.php?p=libinfo. Replace the word “libinfo” with the word “login” so it looks like this, http: //localhost/slims9_bulian/index.php?p=login. Then enter to bring up login access. img Tip After this login access appears, don’t forget to bookmark the page. So that it can appear on the bookmark bar in the browser you use. By bookmarking the access, then, if you want to log in, you just click on the bookmark. Several improvements to the login page were made to make access to the Administration Page even easier. img Remember me is a feature to extend login time after login. When this feature is checked during login, the system will ignore the login session. Meanwhile, Forgot my password is used to make it easier for Librarians to recover passwords. When Librarian uses this feature, he will be directed to the password reset page. img Enter the email address you registered in the System> Librarian and System Users module, check the “I’m not a robot” field and then click on the “Reset my password” button. Then the system will inform img that an email has been sent for the process of changing the password. Check your inbox in your email, then you will receive an email like the following picture. img Click on the “Reset Password” button to start changing your password and you will be taken to a page as shown below. img Enter the replacement password you want and continue by clicking on the “Update” button. After clicking on the button, you will be taken to the Administration login page. Then log in with the password you have changed. Note To be able to use this feature, the computer (with SLiMS in it) that you use must be connected to the internet. Due to the provided password change service, it is on the internet. If the SLiMS you are using is already on the internet, no further settings are needed to use this feature.", "folder": "OPAC"}, {"path": "OPAC/4. OPAC Search.html", "title": "4. OPAC Search", "content": "tmpqsiw10f_ The default SLiMS Bulian OPAC presents a simple Search text box for users to begin to enter search terms. When text is entered additional option buttons appear, as below: Users can simply press the Enter key, to search across the collection with the default “All” setting, or they can narrow the Search to just Author , or Subject , or ISBN fields. More sophisticated searches can be accessed by clicking the Advanced search button. This lets the user search more bibliographic fields as shown below: Note: the Akasia OPAC search interface which is still available in SLiMS 9.7.2 is similar but with less features .", "folder": "OPAC"}, {"path": "OPAC/5. OPAC Results.html", "title": "5. OPAC Results", "content": "tmpq4pocsoa If no result is found from a search, the user is informed as below: If results from a search are returned, the user has a number of options. The default sorting of the returned results is by “ Most relevant ”, but a number of other sorting criteria can be applied from the drop-down menu, as shown: Results can also be filtered via a wide range of criteria, including publication date-range, availability, whether there are attachments, the collection type, GMD, location, and language. Each result presents a summary of cataloguing data of a title, an image of the title, and buttons for each author. Clicking an author button on a result will trigger a search for all additional titles by that author. Clicking the Availability button ( which also displays the number of available copies), will Add to Basket that title, IF the library member is logged in. If they are not they will be redirected to the Member login. Clicking the MARC download button will automatically download a MARC record ( *.mrc ) to the user’s default download location. Clicking the Cite button will produce a pop-up with several bibliographic citations for the title in different formats. Users can cut and paste the result. Clicking on a title in the results list will display full cataloguing data for that title, with its Authors and Subjects being hyperlinked to searches. If the member is logged in they will be able to post comments / reviews for that title. Buttons are also provided to allow logged-in members to Bookmark the title for future use and to Share the title details on WhatsApp, Telegram, or via a copied link. Note: the Akasia OPAC search results are similar but with some variation in features. Akasia lacks the variety of sorting and filtering options, the user Basket feature is not accessible , and the social media options are different .", "folder": "OPAC"}, {"path": "OPAC/aboutopac.html", "title": "aboutopac", "content": "tmpn1q_sa5_ OPAC is an acronym for Online Public Access Catalog with free translation. Online catalog means a series of information about a product, in this case a book, published using internet media which is packaged in one page or website so that it can be accessed from anywhere, anytime, by anyone. OPAC is a designation for one of the interfaces used by SLiMS. Another interface is the Administration Pages interface. The Administration Homepage interface will be discussed and will be seen in the next chapter. In this chapter, we will look at the details of the SLiMS OPAC interface. SLiMS OPAC | from time-to-time img Senayan 3 Stable 14 Seulanga OPAC displays menu, header, sidebar, content, and footer. The menus provided are Home, Library Information, Help on Search, Member Area, and Librarian login. The header is the SLiMS logo, title and subtitles. Then the sidebar consists of Select Language, Simple Search, Advanced Search. For content contains collections that can be accessed by the library user. While the footer is brief information about SLiMS. img OPAC on Senayan 3 Stable 15 Matoa, has no significant changes to what has been developed in OPAC on Senayan 3 Stable 14 Seulanga. There are changes at several points, including adding a background to the header, placing the Search column in the header section previously in the sidebar and changing the basic color to make it look more vibrant. img The SLiMS 5 Meranti OPAC display underwent a significant change from the two previous SLiMS versions. This is indicated by the absence of a sidebar and content from the data collection entry process. The focus of the changes is by placing the Search column in the middle of the OPAC display so that it becomes more elegant. In addition there is the addition of a top section in the form of a navbar containing social media links and new placements from Select Language. img The SLiMS 7 Cendana OPAC display just enhances what has been done on the SLiMS 5 Meranti OPAC display. Improvements produce a background with a higher resolution so that it looks more attractive. Then there are additions to the sub menu, namely Librarian which provides information related to librarians managing libraries. img OPAC display Slims 8 Akasia be more different. The SLiMS 8 Akasia OPAC looks simple but still has an elegant impression. Many changes were made to the SLiMS 8 Akasia OPAC display, including the addition of a menu logo. The menu provided is Home, Library News, Library Information, Library Location, Member Area, Librarian, Help on Search, Librarian Login, and About SLiMS, as well as a language replacement menu interface. The search column is simpler because it only provides one column but does not reduce the quality of the search results. The addition of a feature to the SLiMS 8 Akasia OPAC is a live chat feature. Then the social media placement is also changed to the footer section. img The new version, the display is made to be more fresh. Slims 9 OPAC Classic Bulian uses a template which has been optimized. In this template, update bibliographic data displayed based on the classification. Shown is also the most popular collections list, a list of the latest collection as well as updated, the list of borrowers. The menu is displayed on the header template, so immediately visible to the user.", "folder": "OPAC"}];
